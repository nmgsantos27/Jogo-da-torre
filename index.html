<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>Defenda a Torre</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0a1020; color:#e8ecf5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; justify-content:center; align-items:center; }
  #app { width:100%; max-width:500px; height:100%; height:100dvh;
    display:flex; flex-direction:column; position:relative;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom); background:#0a1020; }

  /* HUD */
  #hud { display:flex; align-items:center; gap:8px; padding:12px 14px;
    background:#0f1626; border-bottom:1px solid rgba(255,255,255,0.05); flex-shrink:0; }
  .hstat { display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .hstat .val { font-size:14px; font-weight:800; }
  .hstat .lbl { font-size:9px; font-weight:700; color:#5a6b82; margin-top:2px; letter-spacing:0.5px; }
  .hstat.gold .val { color:#ffd700; }
  .hstat.ess .val  { color:#c77dff; }
  .hstat.life .val { color:#ff5252; }
  .hstat.wave .val { color:#4ecdc4; }
  .hstat.score .val{ color:#ce93d8; }
  .hspacer { flex:1; }
  .hbtn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    color:#e8ecf5; border-radius:8px; padding:6px 10px; font-size:12px;
    font-weight:800; cursor:pointer; }
  .hbtn:active { transform:scale(0.95); }

  /* Arena */
  #gamewrap { flex:1; position:relative; overflow:hidden; background:#0a1020; }
  canvas#cv { display:block; width:100%; height:100%; touch-action:none; }

  #menuBtn { position:absolute; top:12px; right:12px; z-index:5;
    width:44px; height:44px; border-radius:12px;
    background:rgba(78,205,196,0.1); border:1px solid rgba(78,205,196,0.3);
    color:#4ecdc4; font-size:22px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  #menuBtn:active { transform:scale(0.92); }

  #pauseBadge { position:absolute; top:12px; left:12px; z-index:5;
    display:none; padding:6px 12px; border-radius:8px;
    background:rgba(255,215,0,0.15); border:1px solid rgba(255,215,0,0.4);
    color:#ffd700; font-size:12px; font-weight:800; }
  #pauseBadge.show { display:block; }

  #info { position:absolute; top:20%; left:50%; transform:translateX(-50%);
    background:rgba(15,22,38,0.95); border:1px solid rgba(78,205,196,0.4);
    color:#fff; padding:10px 20px; border-radius:20px; font-size:14px;
    font-weight:700; white-space:nowrap; pointer-events:none;
    opacity:0; transition:opacity .2s; z-index:8; }
  #info.show { opacity:1; }

  /* Popup torre */
  #popup { position:absolute; bottom:12px; left:50%; transform:translate(-50%,20px);
    width:calc(100% - 24px); max-width:400px;
    background:#0f1626; border:1px solid rgba(255,255,255,0.1);
    border-radius:16px; padding:16px; z-index:10;
    opacity:0; pointer-events:none; transition:all .2s; box-shadow:0 10px 30px rgba(0,0,0,0.8); }
  #popup.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  .popup-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .popup-title { font-size:16px; font-weight:800; flex:1; }
  .popup-close { width:32px; height:32px; border-radius:8px; background:rgba(255,82,82,0.1);
    border:1px solid rgba(255,82,82,0.3); color:#ff5252; font-size:16px; cursor:pointer; }
  .popup-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .pstat { background:rgba(255,255,255,0.03); border-radius:10px; padding:8px; text-align:center; }
  .pstat .v { font-size:14px; font-weight:800; color:#4ecdc4; }
  .pstat .l { font-size:10px; color:#5a6b82; font-weight:700; text-transform:uppercase; margin-top:2px; }
  .popup-btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .pbtn { padding:12px 4px; border-radius:10px; font-size:13px; font-weight:800;
    cursor:pointer; border:none; text-align:center; line-height:1.2; color:#fff; }
  .pbtn small { display:block; font-size:11px; opacity:0.9; margin-top:4px; font-weight:700; }
  .pbtn.upg { background:#2d8a84; }
  .pbtn.evo { background:#7b42bc; }
  .pbtn.sell{ background:#c62828; }
  .pbtn:disabled { opacity:0.3; }
  .pbtn:active:not(:disabled) { transform:scale(0.95); }

  /* Panel (Barra de baixo) */
#panel { 
  display: flex; 
  align-items: stretch; 
  gap: 8px; 
  padding: 8px 10px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  background: #0f1626; 
  border-top: 1px solid rgba(255,255,255,0.05); 
  flex-shrink: 0; 
  height: 85px; /* Altura fixa para não "esmagar" */
}

#towerScroll { 
  flex: 1; 
  display: flex; 
  gap: 6px; /* Gap mais pequeno */
  overflow-x: auto; 
  overflow-y: hidden;
  scrollbar-width: none; 
  -webkit-overflow-scrolling: touch; 
  padding: 2px 4px;
}
#towerScroll::-webkit-scrollbar { display: none; }

.tbtn { 
  flex-shrink: 0; 
  width: 62px; /* Mais estreito para caberem mais no ecrã */
  padding: 6px 2px; 
  border-radius: 12px;
  background: #141c2e; 
  border: 1px solid rgba(255,255,255,0.08);
  color: #e8ecf5; 
  cursor: pointer; 
  display: flex; 
  flex-direction: column;
  align-items: center; 
  justify-content: center; 
  gap: 2px; 
  position: relative; 
  transition: all .15s; 
}
.tbtn .ico { font-size: 20px; line-height: 1; }
.tbtn .nm { font-size: 9px; font-weight: 700; color: #8fa3bd; white-space: nowrap; }
.tbtn .cost { font-size: 10px; font-weight: 800; color: #ffd700; }
.tbtn.sel { background: rgba(78,205,196,0.15); border-color: #4ecdc4; box-shadow: 0 0 10px rgba(78,205,196,0.2); }
.tbtn.locked { opacity: 0.4; }
.tbtn.locked::after { content: '🔒'; position: absolute; top: 4px; right: 4px; font-size: 11px; }

/* Botão VAGA / CHEFE */
#startBtn { 
  flex-shrink: 0; 
  width: 85px; 
  border-radius: 12px;
  background: #4ecdc4; 
  border: none; 
  color: #0a1020; 
  font-weight: 900; 
  font-size: 11px; /* Fonte mais pequena para caber "A decorrer" */
  cursor: pointer; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  text-align: center;
  line-height: 1.2;
  padding: 4px;
}
#startBtn.boss { background: #f44336; color: #fff; animation: pulse 1s infinite; }
#startBtn:disabled { opacity: 0.5; background: #2d3a4f; color: #8fa3bd; }

  /* Talent screen */
  #talentScreen, #overlay { position:absolute; inset:0; z-index:50; background:#0a1020;
    display:flex; flex-direction:column; padding:20px; opacity:0; pointer-events:none;
    transition:opacity .2s; overflow-y:auto; }
  #talentScreen.show, #overlay.show { opacity:1; pointer-events:auto; }

  .tal-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; color:#c77dff; }
  .tal-head h2 { font-size:22px; font-weight:900; flex:1; }
  .tal-ess { font-size:14px; font-weight:800; color:#c77dff; text-align:center; margin-bottom:16px; }

  .tal-conv-box { background:#221c33; border:1px solid #c77dff; border-radius:12px;
    padding:16px; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .tal-conv-box .icon-box { background:#3d2b59; padding:10px; border-radius:50%; font-size:20px; }
  .tal-conv-box .info { flex:1; }
  .tal-conv-box .info b { font-weight:800; color:#ffd700; display:block; font-size:14px; }
  .tal-conv-box .info span { font-size:12px; color:#8fa3bd; }
  .tal-conv-box button { background:#3d2b59; border:1px solid #5a3d82; color:#ffd700;
    padding:8px 12px; border-radius:8px; font-weight:800; font-size:12px; cursor:pointer; }
  .tal-conv-box button:disabled { opacity:0.4; }

  .tal-list { flex:1; display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .tal-item { display:flex; align-items:center; gap:12px; padding:14px;
    background:#141c2e; border:1px solid rgba(255,255,255,0.08); border-radius:16px; }
  .tal-item .tico { font-size:28px; }
  .tal-item .tinfo { flex:1; }
  .tal-item .tnm { font-size:15px; font-weight:800; }
  .tal-item .tdesc { font-size:11px; color:#8fa3bd; font-weight:600; margin-top:2px; }
  .tal-item .tlvl { font-size:12px; font-weight:800; color:#c77dff; }
  .tal-buy { background:#7b42bc; border:none; color:#fff; padding:10px 14px;
    border-radius:10px; font-weight:900; font-size:13px; cursor:pointer; }
  .tal-buy:disabled { background:#2d1f3d; color:#8855aa; }

  .tal-bottom { display:flex; gap:10px; margin-top:10px; }
  .tal-close, .tal-rank { flex:1; padding:16px; border-radius:14px; border:none;
    font-weight:900; font-size:15px; color:#fff; cursor:pointer; text-align:center; }
  .tal-close { background:#3a506b; }
  .tal-rank { background:#ab47bc; }
  .tal-save { width:100%; padding:16px; margin-top:10px; border-radius:14px; border:none;
    font-weight:900; font-size:15px; background:#2e7d32; color:#fff; cursor:pointer; }

  /* Overlay game over */
  #overlay { background:rgba(10,16,32,0.98); justify-content:center; align-items:center; text-align:center; }
  .ov-title { font-size:32px; font-weight:900; color:#ff5252; margin-bottom:10px; }
  .ov-sub { color:#8fa3bd; font-weight:700; font-size:14px; }
  .ov-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:300px; margin:20px 0; }
  .ov-stat { background:#141c2e; padding:12px; border-radius:12px; }
  .ov-stat .v { font-size:20px; font-weight:900; color:#4ecdc4; }
  .ov-stat .l { font-size:10px; color:#8fa3bd; font-weight:700; text-transform:uppercase; }
  .ov-input { width:100%; max-width:300px; padding:14px; border-radius:12px;
    background:#141c2e; border:1px solid #3a506b; color:#fff; font-size:16px; font-weight:700;
    text-align:center; margin-bottom:10px; outline:none; }
  .ov-btn { width:100%; max-width:300px; padding:16px; border-radius:12px;
    background:#4ecdc4; border:none; color:#0a1020; font-weight:900; font-size:16px; cursor:pointer; }
  .ov-ranking { width:100%; max-width:300px; max-height:140px; overflow-y:auto; margin-top:16px; }
  .rk-item { display:flex; gap:8px; padding:8px 10px; background:#141c2e;
    border-radius:8px; font-size:12px; margin-bottom:4px; }
  .rk-pos { font-weight:900; color:#ffd700; min-width:22px; }
  .rk-name { flex:1; font-weight:700; text-align:left; }
  .rk-score { font-weight:900; color:#4ecdc4; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hstat gold"><div class="val" id="goldLbl">0</div><div class="lbl">OURO</div></div>
    <div class="hstat ess"><div class="val" id="essLbl">0</div><div class="lbl">ESSÊNCIA</div></div>
    <div class="hstat life"><div class="val" id="lifeLbl">20</div><div class="lbl">VIDAS</div></div>
    <div class="hstat wave"><div class="val" id="waveLbl">1</div><div class="lbl">VAGA</div></div>
    <div class="hstat score"><div class="val" id="scoreLbl">0</div><div class="lbl">PONTOS</div></div>
    <div class="hspacer"></div>
    <button class="hbtn" id="speedBtn">1x</button>
    <button class="hbtn" id="convBtn">🪙→💎</button>
  </div>

  <div id="gamewrap">
    <canvas id="cv"></canvas>
    <button id="menuBtn">🌳</button>
    <div id="pauseBadge">⏸ PAUSA</div>
    <div id="info"></div>

    <div id="popup">
      <div class="popup-head">
        <div class="popup-title" id="popTitle">Torre</div>
        <button class="popup-close" id="popClose">✕</button>
      </div>
      <div class="popup-stats">
        <div class="pstat"><div class="v" id="psDmg">0</div><div class="l">Dano</div></div>
        <div class="pstat"><div class="v" id="psRng">0</div><div class="l">Alcance</div></div>
        <div class="pstat"><div class="v" id="psRate">0</div><div class="l">Velocidade</div></div>
      </div>
      <div class="popup-btns">
        <button class="pbtn upg" id="upgBtn">Melhorar<small id="upgCost">0</small></button>
        <button class="pbtn evo" id="evoBtn">Evoluir<small id="evoCost">0</small></button>
        <button class="pbtn sell" id="sellBtn">Vender<small id="sellVal">0</small></button>
      </div>
    </div>
  </div>

  <div id="panel">
    <div id="towerScroll"></div>
    <button id="startBtn"><span id="startBtnTxt">VAGA 1</span></button>
  </div>

  <div id="talentScreen">
    <div class="tal-head">
      <h2>🌳 Árvore de Talentos</h2>
    </div>
    <div class="tal-ess">Essência total: <span id="talEss">0</span> 💎</div>

    <div class="tal-conv-box">
      <div class="icon-box">🪙</div>
      <div class="info">
        <b><span id="convGoldTxt">0</span> 🪙 disponíveis</b>
        <span>250 🪙 = 1 💎</span>
      </div>
      <button id="talConv">Converter</button>
    </div>

    <div class="tal-list" id="talList"></div>

    <div class="tal-bottom">
      <button class="tal-rank" id="btnRanking">🏆 Ranking</button>
      <button class="tal-close" id="talClose">Voltar ao Jogo</button>
    </div>
    <button class="tal-save" id="talSave">💾 Guardar Jogo</button>
  </div>

  <div id="overlay">
    <div class="ov-title">Fim de Jogo</div>
    <div class="ov-sub">A torre caiu na vaga <span id="ovWave">1</span>!</div>
    <div class="ov-stats">
      <div class="ov-stat"><div class="v" id="ovWave2">0</div><div class="l">Vagas</div></div>
      <div class="ov-stat"><div class="v" id="ovScore">0</div><div class="l">Pontos</div></div>
      <div class="ov-stat"><div class="v" id="ovKills">0</div><div class="l">Abates</div></div>
      <div class="ov-stat"><div class="v" id="ovTowers">0</div><div class="l">Torres</div></div>
    </div>
    <input class="ov-input" id="ovName" placeholder="O teu nome" maxlength="16">
    <button class="ov-btn" id="ovBtn">Jogar Novamente</button>
    <div class="ov-ranking" id="ovRanking"></div>
  </div>
</div>
<script>
"use strict";

const SAVE_KEY = "torreProgressV29";
const TILE = 36;
const MAX_RANKING = 20;

const TOWER_TYPES = {
  archer:    { name:"Arqueiro",  ico:"🏹", cost:60,  dmg:1, range:130, rate:28, color:"#4ecdc4", special:null,        unlock:null },
  cannon:    { name:"Canhão",    ico:"💣", cost:110, dmg:4, range:110, rate:70, color:"#ff9800", special:"splash",   splash:55,  unlock:null },
  ice:       { name:"Gelo",      ico:"❄️", cost:90,  dmg:1, range:120, rate:40, color:"#81d4fa", special:"slow",     slow:0.5,   unlock:null },
  lightning: { name:"Relâmpago", ico:"⚡", cost:150, dmg:3, range:140, rate:45, color:"#ffd700", special:"chain",    chain:3,    unlock:"lightning" },
  poison:    { name:"Veneno",    ico:"☠️", cost:130, dmg:2, range:125, rate:35, color:"#9ccc65", special:"poison",   poisonDmg:1.5, unlock:"poison" }
};

const ENEMY_TYPES = {
  goblin: { name:"Goblin", hp:3,  gold:6,  color:"#7cb342", speed:0.9,  radius:10 },
  orc:    { name:"Orc",    hp:8,  gold:10, color:"#8d6e63", speed:0.75, radius:12 },
  swift:  { name:"Veloz",  hp:5,  gold:8,  color:"#ffb74d", speed:1.35, radius:9  },
  tank:   { name:"Tanque", hp:20, gold:18, color:"#b0bec5", speed:0.55, radius:14 },
  boss:   { name:"Chefe",  hp:85, gold:50, color:"#e53935", speed:0.5,  radius:18, lives:5 }
};

const TALENTS = [
  { id:"force",    ico:"⚔️", name:"Força",       desc:"+15% dano das torres por nível",        max:5, cost:n=>4+n*2 },
  { id:"greed",    ico:"🪙", name:"Ganância",    desc:"+20% ouro obtido por nível",            max:5, cost:n=>3+n*2 },
  { id:"vital",    ico:"❤️", name:"Vitalidade",  desc:"+2 vidas iniciais por nível",           max:5, cost:n=>3+n*2 },
  { id:"precision",ico:"🎯", name:"Precisão",    desc:"+8% alcance das torres por nível",      max:5, cost:n=>4+n*2 },
  { id:"speed",    ico:"⏱️", name:"Celeridade",  desc:"+10% cadência de tiro por nível",       max:5, cost:n=>5+n*2 },
  { id:"heritage", ico:"💰", name:"Herança",     desc:"+40 ouro inicial por nível",            max:3, cost:n=>6+n*2 },
  { id:"channel",  ico:"🔮", name:"Canalização", desc:"+1 essência extra por vaga",            max:5, cost:n=>5+n*3 }
];

/* Estado persistente */
function defaultPersistent() {
  return {
    essence: 0, talents: {}, unlocked: { lightning:false, poison:false },
    bestWave: 0, bestScore: 0, totalKills: 0, totalGames: 0,
    ranking: [], savedState: null, playerName: ""
  };
}
let persistent = defaultPersistent();

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (!p || typeof p !== "object") return;
    persistent = Object.assign(defaultPersistent(), p);
    persistent.essence = Math.max(0, Number(persistent.essence) || 0);
    persistent.talents = (persistent.talents && typeof persistent.talents === "object") ? persistent.talents : {};
    persistent.unlocked = Object.assign({ lightning:false, poison:false }, persistent.unlocked || {});
    persistent.ranking = Array.isArray(persistent.ranking) ? persistent.ranking.slice(0, MAX_RANKING) : [];
    persistent.playerName = typeof persistent.playerName === "string" ? persistent.playerName.slice(0,16) : "";
    if (persistent.savedState && typeof persistent.savedState !== "object") persistent.savedState = null;
  } catch(e) { console.warn("load falhou", e); persistent = defaultPersistent(); }
}

let saveDirty = false, lastSaveTime = 0;
function saveProgress(force) {
  const now = performance.now();
  if (!force && now - lastSaveTime < 1000) { saveDirty = true; return; }
  lastSaveTime = now; saveDirty = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(persistent)); }
  catch(e) { console.warn("save falhou", e); }
}

/* Estado da ronda */
let gold = 0, lives = 20, maxLives = 20, wave = 1, score = 0;
let running = false, gameOverFlag = false, paused = false;
let selectedType = null, selectedTower = null;
let towers = [], enemies = [], projectiles = [], particles = [], floats = [];
let spawnQueue = [], spawnTimer = 0, slots = [], PATH = [];
let killsThisRun = 0, towersBuiltThisRun = 0;
let speedMul = 1, scoreSubmitted = false, hudDirty = true;
let hoverSlot = null, hoverPos = { x:-999, y:-999 };

/* DOM refs */
const $ = id => document.getElementById(id);
const cv = $("cv");
const ctx = cv.getContext("2d");
const goldLbl = $("goldLbl"), essLbl = $("essLbl"), lifeLbl = $("lifeLbl"),
      waveLbl = $("waveLbl"), scoreLbl = $("scoreLbl"), speedBtn = $("speedBtn"),
      convBtn = $("convBtn"), menuBtn = $("menuBtn"), pauseBadge = $("pauseBadge"),
      infoEl = $("info"), popup = $("popup"), popTitle = $("popTitle"),
      popClose = $("popClose"), psDmg = $("psDmg"), psRng = $("psRng"), psRate = $("psRate"),
      upgBtn = $("upgBtn"), upgCost = $("upgCost"), evoBtn = $("evoBtn"), evoCost = $("evoCost"),
      sellBtn = $("sellBtn"), sellVal = $("sellVal"), towerScroll = $("towerScroll"),
      startBtn = $("startBtn"), startBtnTxt = $("startBtnTxt"),
      talentScreen = $("talentScreen"), talEss = $("talEss"), talConv = $("talConv"),
      talList = $("talList"), talClose = $("talClose"), talSave = $("talSave"),
      btnRanking = $("btnRanking"), convGoldTxt = $("convGoldTxt"),
      overlay = $("overlay"), ovWave = $("ovWave"), ovWave2 = $("ovWave2"),
      ovScore = $("ovScore"), ovKills = $("ovKills"), ovTowers = $("ovTowers"),
      ovName = $("ovName"), ovBtn = $("ovBtn"), ovRanking = $("ovRanking");

/* Utilitários */
function vibrate(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(_){} } }
function rand(a,b) { return a + Math.random()*(b-a); }
function dist(a,b) { const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }

let infoTimer = 0;
function showInfo(msg) {
  infoEl.textContent = msg; infoEl.classList.add("show");
  clearTimeout(infoTimer);
  infoTimer = setTimeout(()=>infoEl.classList.remove("show"), 1600);
}
function burst(x, y, color, n) {
  for (let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2, s = rand(1.2,3.4);
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, decay:rand(0.02,0.05), color, size:rand(2,4) });
  }
}
function floatText(x, y, txt, color) { floats.push({ x, y, txt, color, life:1, vy:-0.8 }); }

/* Canvas / grelha */
let COLS = 10, ROWS = 14, offX = 0, offY = 0;

function resizeCanvas() {
  const wrap = $("gamewrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rebuildStrategicSlots(w, h);
}

function rebuildStrategicSlots(w, h) {
  const margin = 8;
  COLS = Math.max(7, Math.floor((w - margin*2) / TILE));
  ROWS = Math.max(10, Math.floor((h - margin*2) / TILE));
  offX = Math.floor((w - COLS*TILE) / 2);
  offY = Math.floor((h - ROWS*TILE) / 2);

  const old = {};
  towers.forEach(t => { old[t.col + "," + t.row] = t; });

  slots = [];
  towers = [];
  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      slots.push({
        col:c, row:r,
        x: offX + c*TILE + TILE/2,
        y: offY + r*TILE + TILE/2,
        occupied:false, buildable:true
      });
    }
  }

  PATH = buildPath(offX, offY);

  // Bloqueia slots a menos de TILE*0.8 do caminho
  slots.forEach(s => {
    for (let i=0;i<PATH.length-1;i++) {
      if (distToSegment(s, PATH[i], PATH[i+1]) < TILE*0.85) { s.buildable = false; break; }
    }
  });

  // Restaura torres
  slots.forEach(s => {
    if (!s.buildable) return;
    const t = old[s.col + "," + s.row];
    if (t) {
      s.occupied = true;
      t.slot = s;
      t.x = s.x; t.y = s.y;
      towers.push(t);
    }
  });
}

function distToSegment(p, v, w) {
  const l2 = (w.x-v.x)**2 + (w.y-v.y)**2;
  if (l2 === 0) return Math.hypot(p.x-v.x, p.y-v.y);
  let t = ((p.x-v.x)*(w.x-v.x) + (p.y-v.y)*(w.y-v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (v.x + t*(w.x-v.x)), p.y - (v.y + t*(w.y-v.y)));
}

function buildPath(offX, offY) {
  const c1 = Math.max(1, Math.floor(COLS * 0.15));
  const c2 = COLS - 1 - Math.max(1, Math.floor(COLS * 0.15));
  const r1 = Math.max(1, Math.floor(ROWS * 0.30));
  const r2 = Math.max(r1 + 2, Math.floor(ROWS * 0.65));
  const pts = [
    { col: c1, row: 0 },
    { col: c1, row: r1 },
    { col: c2, row: r1 },
    { col: c2, row: r2 },
    { col: c1, row: r2 },
    { col: c1, row: ROWS - 1 }
  ];
  return pts.map(p => ({
    x: offX + p.col * TILE + TILE/2,
    y: offY + p.row * TILE + TILE/2
  }));
}

/* ══════════════════════════════════════════════════════════════
   TALENTOS — MULTIPLICADORES
   ══════════════════════════════════════════════════════════════ */
function talentLvl(id) { return persistent.talents[id] || 0; }
function dmgMul()       { return 1 + talentLvl("force")*0.15; }
function goldMul()      { return 1 + talentLvl("greed")*0.20; }
function rangeMul()     { return 1 + talentLvl("precision")*0.08; }
function rateMul()      { return 1 - talentLvl("speed")*0.10; }
function startGoldBonus(){ return talentLvl("heritage")*40; }
function startLivesBonus(){ return talentLvl("vital")*2; }
function essencePerWave(){ return 1 + talentLvl("channel"); }

/* ══════════════════════════════════════════════════════════════
   TORRES — STATS / CUSTOS
   ══════════════════════════════════════════════════════════════ */
function towerStats(t) {
  const base = TOWER_TYPES[t.type];
  const lvlMul = Math.pow(1.6, t.level-1);
  const starMul = Math.pow(1.35, t.stars);
  const dmg = base.dmg * lvlMul * starMul * dmgMul();
  const range = (base.range + (t.level-1)*18 + t.stars*12) * rangeMul();
  const rate = base.rate * Math.pow(0.82, t.level-1) * Math.pow(0.9, t.stars) * rateMul();
  return { dmg, range, rate: Math.max(8, rate) };
}
function towerUpgradeCost(t) { return Math.floor(TOWER_TYPES[t.type].cost * 0.6 * t.level); }
function towerEvolveCost(t)  { return 4 + t.stars * 4; }
function towerSellValue(t)   { return Math.floor((TOWER_TYPES[t.type].cost + (t.level-1)*30) * 0.6); }

/* ══════════════════════════════════════════════════════════════
   CONSTRUÇÃO / GESTÃO DE TORRES
   ══════════════════════════════════════════════════════════════ */
function buildTower(slot, type) {
  const base = TOWER_TYPES[type];
  if (!base) return;
  if (base.unlock && !persistent.unlocked[base.unlock]) { showInfo("🔒 Bloqueada"); return; }
  if (gold < base.cost) { showInfo("🪙 Ouro insuficiente"); return; }
  if (slot.occupied || !slot.buildable) return;
  gold -= base.cost;
  const t = { type, level:1, stars:0, col:slot.col, row:slot.row,
    x:slot.x, y:slot.y, slot, cooldown:0, angle:0 };
  slot.occupied = true;
  towers.push(t);
  towersBuiltThisRun++;
  hudDirty = true;
  vibrate(15);
  burst(t.x, t.y, base.color, 8);
  saveProgress(false);
}

function upgradeTower(t) {
  if (t.level >= 3) { showInfo("⭐ Nível máximo"); return; }
  const cost = towerUpgradeCost(t);
  if (gold < cost) { showInfo("🪙 Ouro insuficiente"); return; }
  gold -= cost; t.level++;
  hudDirty = true; vibrate(12);
  burst(t.x, t.y, "#4ecdc4", 10);
  refreshPopup(); saveProgress(false);
}
function evolveTower(t) {
  if (t.level < 3) { showInfo("⬆️ Precisas de nível 3"); return; }
  if (t.stars >= 5) { showInfo("🌟 Estrela máxima!"); return; }
  const cost = towerEvolveCost(t);
  if (persistent.essence < cost) { showInfo("💎 Essência insuficiente"); return; }
  persistent.essence -= cost; t.stars++;
  hudDirty = true; vibrate(20);
  burst(t.x, t.y, "#c77dff", 16);
  refreshPopup(); saveProgress(false);
}
function sellTower(t) {
  const val = towerSellValue(t);
  gold += val;
  t.slot.occupied = false;
  towers = towers.filter(x => x !== t);
  selectedTower = null; hidePopup(); hudDirty = true;
  burst(t.x, t.y, "#ffd700", 10);
  floatText(t.x, t.y-16, "+" + val, "#ffd700");
  saveProgress(false);
}

/* ══════════════════════════════════════════════════════════════
   POPUP
   ══════════════════════════════════════════════════════════════ */
function showPopup(t) { selectedTower = t; popup.classList.add("show"); refreshPopup(); }
function hidePopup()  { popup.classList.remove("show"); selectedTower = null; }
function refreshPopup() {
  const t = selectedTower;
  if (!t) return;
  const base = TOWER_TYPES[t.type];
  const st = towerStats(t);
  popTitle.textContent = base.ico + " " + base.name + " " + "⭐".repeat(t.stars) + " · Nv." + t.level;
  psDmg.textContent = st.dmg.toFixed(1);
  psRng.textContent = Math.round(st.range);
  psRate.textContent = Math.round(st.rate) + "f";
  const upCost = towerUpgradeCost(t), evCost = towerEvolveCost(t), sv = towerSellValue(t);
  if (t.level >= 3) { upgBtn.disabled = true; upgCost.textContent = "MAX"; }
  else { upgBtn.disabled = gold < upCost; upgCost.textContent = "🪙 " + upCost; }
  if (t.stars >= 5) { evoBtn.disabled = true; evoCost.textContent = "MAX"; }
  else { evoBtn.disabled = t.level < 3 || persistent.essence < evCost; evoCost.textContent = "💎 " + evCost; }
  sellBtn.disabled = false; sellVal.textContent = "🪙 " + sv;
}

/* ══════════════════════════════════════════════════════════════
   INIMIGOS
   ══════════════════════════════════════════════════════════════ */
function spawnEnemy(type, waveNum) {
  const base = ENEMY_TYPES[type];
  if (!base) return;
  const hpScale = 1 + (waveNum-1)*0.35;
  const hp = Math.ceil(base.hp * hpScale);
  enemies.push({ type, hp, maxHp:hp, gold: base.gold, speed: base.speed,
    radius: base.radius, color: base.color, x: PATH[0].x, y: PATH[0].y,
    waypoint: 1, slow: 0, poison: 0, poisonDmg: 0, alive: true });
}

function startWave() {
  if (running) return;
  running = true; paused = false;
  spawnQueue = []; spawnTimer = 0;
  const isBoss = wave % 5 === 0;
  const count = isBoss ? 6 + Math.floor(wave*0.5) : 6 + Math.floor(wave*0.8);
  for (let i=0;i<count;i++) {
    let type = "goblin";
    if (wave >= 3 && Math.random() < 0.3) type = "orc";
    if (wave >= 5 && Math.random() < 0.2) type = "swift";
    if (wave >= 8 && Math.random() < 0.2) type = "tank";
    spawnQueue.push({ type, delay: i===0 ? 0 : 45 });
  }
  if (isBoss) spawnQueue.push({ type:"boss", delay: 30 });
  startBtn.disabled = true;
  updateStartBtn();
}

function hitEnemy(e, dmg) {
  if (!e.alive) return;
  e.hp -= dmg;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  if (!e.alive) return;
  e.alive = false;
  enemies = enemies.filter(x => x !== e);
  const g = Math.round(e.gold * goldMul());
  gold += g; score += g; killsThisRun++;
  hudDirty = true;
  burst(e.x, e.y, e.color, 6);
  floatText(e.x, e.y-14, "+" + g, "#ffd700");
  if (e.type === "boss") { persistent.essence += 2; saveProgress(false); }
}
function damageBase(e) {
  if (!e.alive) return;
  const dmg = e.type === "boss" ? 5 : 1;
  lives -= dmg; vibrate(40);
  e.alive = false;
  enemies = enemies.filter(x => x !== e);
  hudDirty = true;
  burst(e.x, e.y, "#ff5252", 12);
  if (lives <= 0) endGame();
}

/* ══════════════════════════════════════════════════════════════
   PROJÉTEIS
   ══════════════════════════════════════════════════════════════ */
function fireProjectile(t, target) {
  const base = TOWER_TYPES[t.type];
  const st = towerStats(t);
  t.angle = Math.atan2(target.y - t.y, target.x - t.x);
  projectiles.push({ x:t.x, y:t.y, target, speed:8, dmg:st.dmg,
    color:base.color, type:t.type, special:base.special,
    splash:base.splash || 0, slow:base.slow || 0,
    chain:base.chain || 0, poisonDmg:base.poisonDmg || 0, hit:false });
}
function hitProjectile(p) {
  if (p.hit) return;
  p.hit = true;
  const tgt = p.target;
  if (!tgt || !tgt.alive) return;
  if (p.special === "splash") {
    enemies.forEach(e => {
      if (!e.alive) return;
      if (dist(e, tgt) <= p.splash) { hitEnemy(e, p.dmg); if (e.alive) burst(e.x, e.y, p.color, 4); }
    });
  } else if (p.special === "chain") {
    hitEnemy(tgt, p.dmg);
    let last = tgt, chained = [tgt];
    for (let i=0;i<p.chain-1;i++) {
      let next = null, bestD = 90;
      enemies.forEach(e => {
        if (!e.alive || chained.includes(e)) return;
        const d = dist(e, last); if (d < bestD) { bestD = d; next = e; }
      });
      if (!next) break;
      hitEnemy(next, p.dmg * 0.7);
      chained.push(next); last = next;
    }
  } else if (p.special === "slow") {
    hitEnemy(tgt, p.dmg);
    if (tgt.alive) tgt.slow = Math.max(tgt.slow, p.slow);
  } else if (p.special === "poison") {
    hitEnemy(tgt, p.dmg);
    if (tgt.alive) { tgt.poison = 90; tgt.poisonDmg = p.poisonDmg; }
  } else { hitEnemy(tgt, p.dmg); }
  burst(p.x, p.y, p.color, 5);
}

/* ══════════════════════════════════════════════════════════════
   UPDATE
   ══════════════════════════════════════════════════════════════ */
function update() {
  if (paused || !running) return;

  if (spawnQueue.length > 0) {
    spawnTimer++;
    if (spawnTimer >= spawnQueue[0].delay) {
      spawnTimer = 0;
      const s = spawnQueue.shift();
      spawnEnemy(s.type, wave);
    }
  } else if (enemies.length === 0 && running) {
    running = false;
    const bonus = 15 + wave * 5;
    gold += bonus; score += bonus;
    persistent.essence += essencePerWave();
    if (wave % 5 === 0) persistent.essence += 3;
    wave++;
    hudDirty = true;
    vibrate(25);
    showInfo("✅ Vaga concluída! +" + bonus + " 🪙");
    startBtn.disabled = false;
    updateStartBtn();
    saveProgress(false);
    return;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.alive) continue;
    if (e.poison > 0) {
      e.poison--; e.hp -= e.poisonDmg;
      if (e.hp <= 0) { killEnemy(e); continue; }
    }
    let sp = e.speed;
    if (e.slow > 0) { e.slow--; sp *= 0.5; }
    if (e.waypoint < PATH.length) {
      const wp = PATH[e.waypoint];
      const dx = wp.x - e.x, dy = wp.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d < 4) e.waypoint++;
      else { e.x += (dx/d)*sp; e.y += (dy/d)*sp; }
    } else { damageBase(e); }
  }

  towers.forEach(t => {
    t.cooldown--;
    if (t.cooldown > 0) return;
    const st = towerStats(t);
    let target = null, bestD = st.range;
    enemies.forEach(e => {
      if (!e.alive) return;
      const d = dist(e, t);
      if (d < bestD) { bestD = d; target = e; }
    });
    if (target) { fireProjectile(t, target); t.cooldown = st.rate; }
  });

  projectiles = projectiles.filter(p => {
    if (p.hit) return false;
    const tgt = p.target;
    if (!tgt || !tgt.alive) return false;
    const dx = tgt.x - p.x, dy = tgt.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < p.speed) { hitProjectile(p); return false; }
    p.x += (dx/d)*p.speed; p.y += (dy/d)*p.speed;
    return true;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94;
    p.life -= p.decay; return p.life > 0;
  });
  floats = floats.filter(f => {
    f.y += f.vy; f.life -= 0.02; return f.life > 0;
  });
}

/* ══════════════════════════════════════════════════════════════
   RENDER — visual premium (caminho terra + castelo)
   ══════════════════════════════════════════════════════════════ */
function render() {
  const w = cv.width / (window.devicePixelRatio || 1);
  const h = cv.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);

  // Fundo
  ctx.fillStyle = "#0a1020";
  ctx.fillRect(0, 0, w, h);

  // Caminho — terra batida
  ctx.strokeStyle = "#4a3b2c";
  ctx.lineWidth = TILE * 0.9;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  PATH.forEach((p, i) => { i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.stroke();

  // Linha central tracejada
  ctx.strokeStyle = "rgba(122,96,70,0.7)";
  ctx.lineWidth = 4;
  ctx.setLineDash([12, 16]);
  ctx.beginPath();
  PATH.forEach((p, i) => { i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.stroke();
  ctx.setLineDash([]);

  // Slots tracejados
  slots.forEach(s => {
    if (!s.buildable) return;
    if (s.occupied) {
      ctx.strokeStyle = "rgba(255,215,0,0.15)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.strokeRect(s.x-TILE*0.4, s.y-TILE*0.4, TILE*0.8, TILE*0.8);
      ctx.setLineDash([]);
      return;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(s.x-TILE*0.4, s.y-TILE*0.4, TILE*0.8, TILE*0.8);
    ctx.setLineDash([]);
  });

  // Preview do alcance
  if (selectedType && hoverSlot) {
    const base = TOWER_TYPES[selectedType];
    if (base) {
      const r = base.range * rangeMul();
      ctx.beginPath();
      ctx.arc(hoverSlot.x, hoverSlot.y, r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(78,205,196,0.10)";
      ctx.fill();
      ctx.strokeStyle = "rgba(78,205,196,0.45)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "rgba(78,205,196,0.35)";
      ctx.fillRect(hoverSlot.x-TILE*0.4, hoverSlot.y-TILE*0.4, TILE*0.8, TILE*0.8);
    }
  }

  // Castelo no fim do caminho (vaga alvo)
  const last = PATH[PATH.length-1];
  ctx.font = "28px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🏰", last.x, last.y - TILE*0.6);

  // Torres
  towers.forEach(t => {
    const base = TOWER_TYPES[t.type];
    if (t === selectedTower) {
      const st = towerStats(t);
      ctx.beginPath();
      ctx.arc(t.x, t.y, st.range, 0, Math.PI*2);
      ctx.fillStyle = "rgba(78,205,196,0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(78,205,196,0.5)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(t.x, t.y, TILE*0.35, 0, Math.PI*2);
    ctx.fillStyle = base.color;
    ctx.fill();
    ctx.strokeStyle = "#0a1020";
    ctx.lineWidth = 3;
    ctx.stroke();
    if (t.stars > 0) {
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 9px sans-serif";
      ctx.fillText("★".repeat(t.stars), t.x, t.y - TILE*0.55);
    }
    ctx.font = "20px sans-serif";
    ctx.fillText(base.ico, t.x, t.y + 1);
  });

  // Inimigos
  enemies.forEach(e => {
    if (!e.alive) return;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
    ctx.fillStyle = e.color; ctx.fill();
    ctx.strokeStyle = "#0a1020"; ctx.lineWidth = 2; ctx.stroke();
    if (e.hp < e.maxHp) {
      const bw = e.radius*2;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(e.x - bw/2, e.y - e.radius - 8, bw, 4);
      ctx.fillStyle = e.type === "boss" ? "#ff5252" : "#4ecdc4";
      ctx.fillRect(e.x - bw/2, e.y - e.radius - 8, bw * (e.hp/e.maxHp), 4);
    }
    if (e.slow > 0) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius+3, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(129,212,250,0.7)"; ctx.lineWidth = 2; ctx.stroke();
    }
    if (e.poison > 0) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius+4, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(156,204,101,0.7)"; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });

  // Projéteis
  projectiles.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
  });

  // Partículas
  particles.forEach(p => {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Floats
  floats.forEach(f => {
    ctx.globalAlpha = f.life; ctx.fillStyle = f.color;
    ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(f.txt, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   HUD / BOTÕES
   ══════════════════════════════════════════════════════════════ */
function updateHUD() {
  goldLbl.textContent = Math.floor(gold || 0);
  essLbl.textContent = persistent.essence;
  lifeLbl.textContent = Math.max(0, lives || 0);
  waveLbl.textContent = wave || 1;
  scoreLbl.textContent = Math.floor(score || 0);
  speedBtn.textContent = speedMul + "x";
  convGoldTxt.textContent = Math.floor(gold || 0);
  hudDirty = false;
}

function updateStartBtn() {
  if (running) {
    startBtnTxt.textContent = "⏳ A jogar";
    startBtn.classList.remove("boss");
    startBtn.disabled = true;
    return;
  }
  const nextWave = wave;
  const isBoss = nextWave % 5 === 0;
  if (isBoss) {
    startBtnTxt.textContent = "CHEFE " + nextWave + " 👑";
    startBtn.classList.add("boss");
  } else {
    startBtnTxt.textContent = "VAGA " + nextWave;
    startBtn.classList.remove("boss");
  }
  startBtn.disabled = false;
}

function buildTowerButtons() {
  towerScroll.innerHTML = "";
  Object.keys(TOWER_TYPES).forEach(type => {
    const base = TOWER_TYPES[type];
    const btn = document.createElement("button");
    btn.className = "tbtn";
    btn.dataset.type = type;
    
    const locked = base.unlock && !persistent.unlocked[base.unlock];
    
    if (locked) {
      btn.classList.add("locked");
      // Adiciona dica de como desbloquear no próprio botão
      btn.innerHTML = '<div class="ico">' + base.ico + '</div>' +
        '<div class="nm" style="color:#ff5252">Bloqueada</div>' +
        '<div class="cost" style="color:#8fa3bd; font-size:9px;">Vai aos Talentos</div>';
    } else {
      btn.innerHTML = '<div class="ico">' + base.ico + '</div>' +
        '<div class="nm">' + base.name + '</div>' +
        '<div class="cost">🪙 ' + base.cost + '</div>';
    }

    btn.addEventListener("click", () => {
      if (locked) { 
        showInfo("🔒 " + base.name + " desbloqueia na Árvore de Talentos"); 
        return; 
      }
      if (selectedType === type) {
        selectedType = null; btn.classList.remove("sel"); hoverSlot = null;
      } else {
        selectedType = type;
        document.querySelectorAll(".tbtn").forEach(b => b.classList.remove("sel"));
        btn.classList.add("sel");
        hidePopup();
      }
    });
    towerScroll.appendChild(btn);
  });
}

// CONTINUA NA PARTE 5/5
/* ══════════════════════════════════════════════════════════════
   EVENTOS CANVAS
   ══════════════════════════════════════════════════════════════ */
function canvasCoords(evt) {
  const r = cv.getBoundingClientRect();
  const pt = evt.touches ? evt.touches[0] : evt;
  return { x: pt.clientX - r.left, y: pt.clientY - r.top };
}

cv.addEventListener("pointerdown", evt => {
  evt.preventDefault();
  if (paused || gameOverFlag) return;
  const p = canvasCoords(evt);
  for (let i = 0; i < towers.length; i++) {
    if (dist(p, towers[i]) < TILE*0.45) { showPopup(towers[i]); return; }
  }
  const slot = slots.find(s => dist(p, s) < TILE/2);
  if (slot && selectedType && !slot.occupied && slot.buildable) {
    buildTower(slot, selectedType);
    hoverSlot = null;
    return;
  }
  hidePopup();
});

cv.addEventListener("pointermove", evt => {
  if (paused || gameOverFlag) return;
  const p = canvasCoords(evt);
  hoverPos = p;
  if (selectedType) {
    hoverSlot = slots.find(s => dist(p, s) < TILE/2 && !s.occupied && s.buildable) || null;
  } else {
    hoverSlot = null;
  }
});

cv.addEventListener("pointerleave", () => {
  hoverSlot = null;
  hoverPos = { x:-999, y:-999 };
});

/* ══════════════════════════════════════════════════════════════
   POPUP — BOTÕES
   ══════════════════════════════════════════════════════════════ */
popClose.addEventListener("click", hidePopup);
upgBtn.addEventListener("click", () => { if (selectedTower) upgradeTower(selectedTower); });
evoBtn.addEventListener("click", () => { if (selectedTower) evolveTower(selectedTower); });
sellBtn.addEventListener("click", () => { if (selectedTower) sellTower(selectedTower); });

/* ══════════════════════════════════════════════════════════════
   HUD — BOTÕES
   ══════════════════════════════════════════════════════════════ */
speedBtn.addEventListener("click", () => {
  speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 3 : 1;
  vibrate(8);
  showInfo("⏩ Velocidade " + speedMul + "x");
  updateHUD();
});

function convertGold() {
  if (gold < 250) { showInfo("🪙 Precisas de 250 ouro"); return; }
  gold -= 250; persistent.essence++;
  hudDirty = true; vibrate(10);
  showInfo("💎 +1 essência");
  if (talentScreen.classList.contains("show")) renderTalentList();
  saveProgress(true);
}
convBtn.addEventListener("click", convertGold);
talConv.addEventListener("click", convertGold);
startBtn.addEventListener("click", () => { startWave(); });

/* ══════════════════════════════════════════════════════════════
   TALENT SCREEN
   ══════════════════════════════════════════════════════════════ */
function openTalents() {
  paused = true;
  pauseBadge.classList.add("show");
  talentScreen.classList.add("show");
  renderTalentList();
  forceSave();
}
function closeTalents() {
  paused = false;
  pauseBadge.classList.remove("show");
  talentScreen.classList.remove("show");
  saveProgress(true);
}

function renderTalentList() {
  talEss.textContent = persistent.essence;
  talList.innerHTML = "";
  TALENTS.forEach(tal => {
    const lvl = talentLvl(tal.id);
    const cost = tal.cost(lvl);
    const maxed = lvl >= tal.max;
    const canBuy = !maxed && persistent.essence >= cost;
    const div = document.createElement("div");
    div.className = "tal-item";
    div.innerHTML = '<div class="tico">' + tal.ico + '</div>' +
      '<div class="tinfo">' +
        '<div class="tnm">' + tal.name + ' <span style="color:#c77dff;font-weight:700;font-size:12px;">(' + lvl + '/' + tal.max + ')</span></div>' +
        '<div class="tdesc">' + tal.desc + '</div>' +
      '</div>' +
      '<button class="tal-buy" ' + (canBuy ? "" : "disabled") + '>' +
        (maxed ? "MAX" : "💎 " + cost) +
      '</button>';
    const btn = div.querySelector(".tal-buy");
    btn.addEventListener("click", () => {
      if (!canBuy) return;
      persistent.essence -= cost;
      persistent.talents[tal.id] = lvl + 1;
      if (tal.id === "force" && lvl+1 >= 3) persistent.unlocked.lightning = true;
      if (tal.id === "greed" && lvl+1 >= 3) persistent.unlocked.poison = true;
      vibrate(15);
      showInfo("✨ " + tal.name + " nível " + (lvl+1));
      renderTalentList();
      buildTowerButtons();
      saveProgress(true);
    });
    talList.appendChild(div);
  });
}

menuBtn.addEventListener("click", openTalents);
talClose.addEventListener("click", closeTalents);

talSave.addEventListener("click", () => {
  forceSave();
  showInfo("💾 Jogo guardado!");
  vibrate(20);
});

btnRanking.addEventListener("click", () => {
  // Abre overlay a mostrar ranking (sem game over)
  overlay.classList.add("show");
  document.querySelector(".ov-title").textContent = "🏆 Ranking";
  document.querySelector(".ov-sub").textContent = "Melhores pontuações";
  ovWave.textContent = "-";
  ovWave2.textContent = "-";
  ovScore.textContent = "-";
  ovKills.textContent = "-";
  ovTowers.textContent = "-";
  ovName.style.display = "none";
  ovBtn.textContent = "Voltar";
  ovBtn.onclick = () => {
    overlay.classList.remove("show");
    ovName.style.display = "block";
    ovBtn.textContent = "Jogar Novamente";
    ovBtn.onclick = defaultOvBtnHandler;
  };
  renderRanking();
});

/* ══════════════════════════════════════════════════════════════
   OVERLAY / RANKING
   ══════════════════════════════════════════════════════════════ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function renderRanking() {
  ovRanking.innerHTML = "";
  const sorted = persistent.ranking.slice().sort((a,b) => b.score - a.score).slice(0, 10);
  if (sorted.length === 0) {
    ovRanking.innerHTML = '<div style="text-align:center;color:#5a6b82;font-size:13px;padding:20px;">Ainda sem recordes</div>';
    return;
  }
  sorted.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "rk-item";
    d.innerHTML = '<div class="rk-pos">#' + (i+1) + '</div>' +
      '<div class="rk-name">' + escapeHtml(r.name || "Anónimo") + '</div>' +
      '<div class="rk-score">' + r.score + '</div>';
    ovRanking.appendChild(d);
  });
}
function showGameOver() {
  gameOverFlag = true;
  running = false;
  overlay.classList.add("show");
  document.querySelector(".ov-title").textContent = "Fim de Jogo";
  document.querySelector(".ov-sub").innerHTML = "A torre caiu na vaga <span id=\"ovWave\">1</span>!";
  ovWave = $("ovWave");
  ovWave.textContent = Math.max(0, wave - 1);
  ovWave2.textContent = Math.max(0, wave - 1);
  ovScore.textContent = Math.floor(score);
  ovKills.textContent = killsThisRun;
  ovTowers.textContent = towersBuiltThisRun;
  ovName.value = persistent.playerName || "";
  ovName.style.display = "block";
  ovBtn.textContent = "Jogar Novamente";
  renderRanking();
}

function defaultOvBtnHandler() {
  const name = (ovName.value || "").trim().replace(/[<>]/g, "").slice(0, 16);
  if (name) persistent.playerName = name;
  startNewGame();
}
ovBtn.addEventListener("click", defaultOvBtnHandler);

/* ══════════════════════════════════════════════════════════════
   GAME OVER / NOVO JOGO
   ══════════════════════════════════════════════════════════════ */
function endGame() {
  if (gameOverFlag) return;
  gameOverFlag = true; running = false;
  persistent.totalGames++;
  persistent.totalKills += killsThisRun;
  if (wave - 1 > persistent.bestWave) persistent.bestWave = wave - 1;
  if (score > persistent.bestScore) persistent.bestScore = Math.floor(score);
  const bonusEss = Math.floor((gold || 0) * 0.005);
  persistent.essence += bonusEss;
  if (!scoreSubmitted) {
    scoreSubmitted = true;
    const name = (persistent.playerName || "Anónimo").slice(0, 16);
    persistent.ranking.push({ name, score: Math.floor(score), wave: wave - 1, date: Date.now() });
    persistent.ranking.sort((a,b) => b.score - a.score);
    persistent.ranking = persistent.ranking.slice(0, MAX_RANKING);
  }
  persistent.savedState = null;
  saveProgress(true);
  showGameOver();
}

function startNewGame() {
  overlay.classList.remove("show");
  gameOverFlag = false; scoreSubmitted = false; paused = false;
  pauseBadge.classList.remove("show");
  persistent.savedState = null;

  gold = 100 + startGoldBonus();
  maxLives = 20 + startLivesBonus();
  lives = maxLives;
  wave = 1; score = 0; running = false;
  selectedType = null; selectedTower = null; hoverSlot = null;
  enemies = []; projectiles = []; particles = []; floats = [];
  spawnQueue = []; spawnTimer = 0;
  killsThisRun = 0; towersBuiltThisRun = 0; speedMul = 1;

  slots.forEach(s => { s.occupied = false; });
  towers = [];

  hudDirty = true;
  updateHUD();
  updateStartBtn();
  buildTowerButtons();
  hidePopup();
  saveProgress(true);
}

/* ══════════════════════════════════════════════════════════════
   LOOP PRINCIPAL
   ══════════════════════════════════════════════════════════════ */
let lastTime = 0, acc = 0;
const FRAME = 1000 / 60;
function loop(now) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  lastTime = now;
  if (!paused) {
    acc += dt * speedMul;
    let steps = 0;
    while (acc >= FRAME && steps < 6) {
      update();
      acc -= FRAME;
      steps++;
    }
    if (acc > FRAME * 6) acc = 0;
  }
  if (hudDirty) updateHUD();
  render();
}

/* ══════════════════════════════════════════════════════════════
   RESIZE
   ══════════════════════════════════════════════════════════════ */
let resizeTimer = 0;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resizeCanvas();
    buildTowerButtons();
  }, 120);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

/* ══════════════════════════════════════════════════════════════
   AUTO-SAVE
   ══════════════════════════════════════════════════════════════ */
function forceSave() {
  if (gameOverFlag) return;
  persistent.savedState = {
    wave, gold, lives, score,
    towers: towers.map(t => ({
      type: t.type, level: t.level, stars: t.stars, col: t.col, row: t.row
    }))
  };
  saveProgress(true);
}

// 1. Guarda a cada 5 segundos
setInterval(() => {
  if (running && !paused) forceSave();
}, 5000);

// 2. Guarda quando a página é escondida/fechada
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    forceSave();
    if (running && !paused) {
      paused = true;
      pauseBadge.classList.add("show");
    }
  }
});
window.addEventListener("pagehide", forceSave);

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
function initGame() {
  loadProgress();

  if (persistent.savedState) {
    // Retoma jogo guardado
    const s = persistent.savedState;
    wave = s.wave || 1;
    gold = s.gold || 100;
    lives = s.lives || 20;
    score = s.score || 0;
    maxLives = 20 + startLivesBonus();
    running = false;
    gameOverFlag = false;
    paused = false;
    scoreSubmitted = false;
    enemies = []; projectiles = []; particles = []; floats = [];
    spawnQueue = []; spawnTimer = 0;
    killsThisRun = 0; towersBuiltThisRun = 0; speedMul = 1;
    selectedType = null; selectedTower = null; hoverSlot = null;

    // Reconstrói torres após o canvas ter slots
    setTimeout(() => {
      rebuildStrategicSlots($("gamewrap").clientWidth, $("gamewrap").clientHeight);
      if (Array.isArray(s.towers)) {
        s.towers.forEach(st => {
          const slot = slots.find(x => x.col === st.col && x.row === st.row && x.buildable);
          if (slot && !slot.occupied) {
            slot.occupied = true;
            towers.push({
              type: st.type, level: st.level || 1, stars: st.stars || 0,
              col: st.col, row: st.row, x: slot.x, y: slot.y,
              slot, cooldown: 0, angle: 0
            });
          }
        });
      }
    }, 80);
  } else {
    // Novo jogo
    gold = 100 + startGoldBonus();
    maxLives = 20 + startLivesBonus();
    lives = maxLives;
    wave = 1; score = 0; running = false;
    gameOverFlag = false; paused = false; scoreSubmitted = false;
    enemies = []; projectiles = []; particles = []; floats = [];
    spawnQueue = []; spawnTimer = 0;
    killsThisRun = 0; towersBuiltThisRun = 0; speedMul = 1;
    selectedType = null; selectedTower = null; hoverSlot = null;
    towers = [];
  }

  resizeCanvas();
  setTimeout(() => {
    resizeCanvas();
    buildTowerButtons();
    updateHUD();
    updateStartBtn();
    renderTalentList();
    ovName.value = persistent.playerName || "";
  }, 60);

  requestAnimationFrame(loop);
}

initGame();
</script>

<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Defenda a Torre</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { 
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    color:#fff; background:#070a14; touch-action:none; 
  }
  #app { 
    display:flex; flex-direction:column; width:100%; height:100vh; height:100dvh;
    max-width:500px; margin:0 auto; background:radial-gradient(circle at 50% 20%, #152238, #070a14);
    position:relative;
  }
  #hud { 
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px; background:rgba(12,20,38,0.95);
    border-bottom:1px solid rgba(255,255,255,0.08); z-index:10; flex-shrink:0;
  }
  .stat { display:flex; flex-direction:column; align-items:center; font-size:9px; flex:1; }
  .stat .v { font-size:12px; font-weight:800; }
  .stat .l { opacity:.7; font-size:7px; text-transform:uppercase; }
  .stat.gold .v { color:#ffd700; }
  .stat.ess .v { color:#c77dff; }
  .stat.life .v { color:#ff5252; }
  .stat.wave .v { color:#4ecdc4; }
  .stat.score .v { color:#ce93d8; }

  #gamewrap { flex:1; position:relative; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }

  #info { position:absolute; top:10px; left:50%; transform:translateX(-50%);
          font-size:11px; color:#ffd700; font-weight:700;
          background:rgba(0,0,0,0.7); padding:4px 12px; border-radius:16px;
          opacity:0; transition:opacity .2s; z-index:5; border:1px solid rgba(255,215,0,0.3); }
  #info.show { opacity:1; }

  #popup { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
           display:none; flex-direction:column; gap:8px;
           background:rgba(10,18,32,0.98); padding:14px;
           border-radius:16px; border:2px solid #3a5a8a; width:220px; z-index:20; }
  #popup.show { display:flex; }
  #popup h3 { margin:0 0 2px; font-size:14px; text-align:center; color:#4ecdc4; }
  #popup button { padding:9px; border-radius:10px; border:none; cursor:pointer;
                  background:#2a4a7a; color:#fff; font-weight:700; font-size:12px; }

  #panel { 
    flex-shrink:0; display:flex; gap:6px; padding:8px 10px;
    background:rgba(10,16,30,0.98); border-top:1px solid rgba(255,255,255,0.08); z-index:10;
  }
  #towersScroll { display:flex; gap:6px; overflow-x:auto; flex:1; }
  .tbtn { 
    flex:0 0 auto; width:52px; height:52px; border-radius:10px;
    border:2px solid #3a5a8a; background:#16233d; color:#fff; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:7.5px; font-weight:700; position:relative;
  }
  .tbtn.sel { border-color:#ffd700; background:#1f3557; }
  .tbtn .ico { font-size:17px; }
  .tbtn .cost { color:#ffd700; font-weight:800; }

  #startBtn { 
    flex:0 0 auto; width:88px; height:52px; border-radius:10px; border:none;
    cursor:pointer; font-size:11px; font-weight:900; color:#fff;
    background:linear-gradient(145deg,#e94560,#b02a44);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #menuBtn { position:absolute; top:8px; right:8px; width:36px; height:36px;
             border-radius:10px; border:2px solid #3a5a8a; background:rgba(10,18,32,0.9);
             color:#fff; font-size:16px; cursor:pointer; z-index:12; display:flex; align-items:center; justify-content:center; }

  #talentScreen { position:absolute; inset:0; display:none; flex-direction:column;
                  background:rgba(5,10,20,0.98); z-index:50; padding:16px; }
  #talentScreen.show { display:flex; }
  #talents { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .talent { display:flex; align-items:center; gap:8px; background:#16233d; border:2px solid #2a3a5a; border-radius:10px; padding:8px; }
  .tbuy { padding:6px 10px; border-radius:8px; border:none; background:#9a3aff; color:#fff; font-weight:800; cursor:pointer; }
  
  #overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:100; padding:16px; }
  #overlay.show { display:flex; }
  .box { background:#1a2a4a; padding:18px; border-radius:18px; text-align:center; border:2px solid #3a5a8a; width:100%; max-width:300px; }
  .box button { margin-top:8px; padding:10px; width:100%; border-radius:8px; border:none; background:#4ecdc4; color:#000; font-weight:800; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat gold"><div class="v" id="gold">150</div><div class="l">Ouro</div></div>
    <div class="stat ess"><div class="v" id="essence">0</div><div class="l">Essência</div></div>
    <div class="stat life"><div class="v" id="lives">15</div><div class="l">Vidas</div></div>
    <div class="stat wave"><div class="v" id="wave">0</div><div class="l">Vaga</div></div>
    <div class="stat score"><div class="v" id="score">0</div><div class="l">Pontos</div></div>
  </div>

  <div id="gamewrap">
    <canvas id="cv"></canvas>
    <button id="menuBtn">🌳</button>
    <div id="info"></div>
    <div id="popup">
      <h3 id="popupTitle">Torre</h3>
      <button id="upg">Melhorar</button>
      <button id="sell" style="background:#8a2a2a;">Vender</button>
      <button id="closePopup" style="background:#3a3a5a;">Fechar</button>
    </div>
  </div>

  <div id="panel">
    <div id="towersScroll">
      <button class="tbtn" data-type="archer"><span class="ico">🏹</span>Arqueiro<span class="cost">60</span></button>
      <button class="tbtn" data-type="cannon"><span class="ico">💣</span>Canhão<span class="cost">110</span></button>
      <button class="tbtn" data-type="frost"><span class="ico">❄️</span>Gelo<span class="cost">90</span></button>
    </div>
    <button id="startBtn">INICIAR</button>
  </div>

  <div id="talentScreen">
    <h2>🌳 Árvore de Talentos</h2>
    <div style="text-align:center; font-size:13px;">Essência: <b id="essBig" style="color:#c77dff;">0</b></div>
    <div id="talents"></div>
    <div style="display:flex; gap:6px;">
      <button class="tbuy" id="closeTalents" style="flex:1; background:#3a5a8a;">Voltar</button>
      <button class="tbuy" id="exportSave" style="flex:1; background:#2a72a4;">📥 Exportar</button>
      <button class="tbuy" id="importSave" style="flex:1; background:#a46a2a;">📤 Importar</button>
    </div>
    <input type="file" id="importFile" style="display:none" accept=".json">
  </div>

  <div id="overlay">
    <div class="box">
      <h1>Fim de Jogo</h1>
      <p>Alcançou a vaga <b id="ovWave">1</b></p>
      <button id="restartBtn">Jogar Novamente</button>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 350, H = 500;

const TOWER_TYPES = {
  archer: { cost:60, dmg:1, range:120, rate:30, color:'#4ecdc4', icon:'🏹' },
  cannon: { cost:110, dmg:4, range:100, rate:60, color:'#ff8c42', icon:'💣' },
  frost:  { cost:90, dmg:1, range:110, rate:40, color:'#7ec8ff', icon:'❄️' }
};

const ENEMY_TYPES = [
  { name:'Goblin', color:'#8bc34a', hp:4, speed:1.2, gold:5, r:12 },
  { name:'Orc', color:'#e57373', hp:10, speed:0.8, gold:10, r:15 }
];

const TALENT_DEFS = [
  { id:'dmg', name:'Força (+15% Dano)', max:5, cost:n=>5+n*5 },
  { id:'gold', name:'Ganância (+20% Ouro)', max:5, cost:n=>4+n*4 }
];

let persistent = { essence:0, talents:{dmg:0, gold:0} };
let gold=150, lives=15, wave=0, score=0, running=false, gameOver=false;
let towers=[], enemies=[], projectiles=[], slots=[], PATH=[];
let selectedType=null, selectedTower=null;

function resize(){
  const rect = cv.parentElement.getBoundingClientRect();
  W = rect.width; H = rect.height;
  cv.width = W; cv.height = H;
  buildPath();
  buildSlots();
}

function buildPath(){
  PATH = [
    {x:0, y:H*0.3}, {x:W*0.3, y:H*0.3}, {x:W*0.3, y:H*0.7},
    {x:W*0.7, y:H*0.7}, {x:W*0.7, y:H*0.3}, {x:W, y:H*0.3}
  ];
}

function buildSlots(){
  slots = [
    {x:W*0.15, y:H*0.15, occupied:false, tower:null},
    {x:W*0.5, y:H*0.15, occupied:false, tower:null},
    {x:W*0.15, y:H*0.5, occupied:false, tower:null},
    {x:W*0.5, y:H*0.5, occupied:false, tower:null},
    {x:W*0.85, y:H*0.5, occupied:false, tower:null}
  ];
}

function save(){
  try { localStorage.setItem('td_save_v1', JSON.stringify(persistent)); } catch(e){}
}
function load(){
  try {
    const data = localStorage.getItem('td_save_v1');
    if(data) persistent = JSON.parse(data);
  } catch(e){}
}

function init(){
  load();
  resize();
  gold = 150; lives = 15; wave = 0; score = 0;
  running = false; gameOver = false;
  towers = []; enemies = []; projectiles = [];
  updateHUD();
}

function updateHUD(){
  document.getElementById('gold').textContent = Math.floor(gold);
  document.getElementById('essence').textContent = persistent.essence;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = wave;
  document.getElementById('score').textContent = score;
}

cv.addEventListener('click', e=>{
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  
  for(const s of slots){
    if(s.tower && Math.hypot(x-s.x, y-s.y)<25){
      selectedTower = s.tower;
      document.getElementById('popup').classList.add('show');
      return;
    }
  }
  for(const s of slots){
    if(!s.occupied && Math.hypot(x-s.x, y-s.y)<25 && selectedType){
      const T = TOWER_TYPES[selectedType];
      if(gold >= T.cost){
        gold -= T.cost;
        s.occupied = true;
        s.tower = {x:s.x, y:s.y, type:selectedType, slot:s, cooldown:0, ...T};
        towers.push(s.tower);
        selectedType = null;
        document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('sel'));
        updateHUD();
      }
    }
  }
});

document.querySelectorAll('.tbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    selectedType = b.dataset.type;
    document.querySelectorAll('.tbtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
});

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(running || gameOver) return;
  wave++; running = true;
  for(let i=0; i<3+wave*2; i++){
    setTimeout(()=> {
      if(!gameOver) enemies.push({...ENEMY_TYPES[i%ENEMY_TYPES.length], x:PATH[0].x, y:PATH[0].y, pathIdx:0, hp:6+wave*2, maxHp:6+wave*2});
    }, i*800);
  }
  updateHUD();
});

document.getElementById('menuBtn').addEventListener('click', openTalents);
document.getElementById('closeTalents').addEventListener('click', ()=>document.getElementById('talentScreen').classList.remove('show'));
document.getElementById('closePopup').addEventListener('click', ()=>document.getElementById('popup').classList.remove('show'));

document.getElementById('sell').addEventListener('click', ()=>{
  if(selectedTower){
    gold += TOWER_TYPES[selectedTower.type].cost * 0.6;
    selectedTower.slot.occupied = false;
    selectedTower.slot.tower = null;
    towers = towers.filter(t=>t!==selectedTower);
    document.getElementById('popup').classList.remove('show');
    updateHUD();
  }
});

document.getElementById('exportSave').addEventListener('click', ()=>{
  const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(persistent));
  const a = document.createElement('a'); a.href = data; a.download = "save_torre.json"; a.click();
});

document.getElementById('importSave').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const reader = new FileReader();
  reader.onload = event => {
    try {
      persistent = JSON.parse(event.target.result);
      save(); init();
      alert('Progresso importado com sucesso!');
    } catch(err){ alert('Ficheiro inválido'); }
  };
  if(e.target.files[0]) reader.readAsText(e.target.files[0]);
});

function openTalents(){
  document.getElementById('essBig').textContent = persistent.essence;
  const list = document.getElementById('talents');
  list.innerHTML = '';
  TALENT_DEFS.forEach(td=>{
    const lvl = persistent.talents[td.id] || 0;
    const cost = td.cost(lvl);
    const div = document.createElement('div');
    div.className = 'talent';
    div.innerHTML = `<div style="flex:1;"><b>${td.name}</b> (${lvl}/${td.max})</div><button class="tbuy">${cost} 💎</button>`;
    div.querySelector('button').addEventListener('click', ()=>{
      if(persistent.essence >= cost && lvl < td.max){
        persistent.essence -= cost;
        persistent.talents[td.id]++;
        save(); openTalents();
      }
    });
    list.appendChild(div);
  });
  document.getElementById('talentScreen').classList.add('show');
}

function loop(){
  ctx.clearRect(0,0,W,H);
  
  // Desenhar Caminho
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 28; ctx.lineJoin = 'round';
  ctx.beginPath(); PATH.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();

  // Slots
  slots.forEach(s=>{
    ctx.fillStyle = s.occupied ? '#1a2a40' : 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.arc(s.x, s.y, 20, 0, Math.PI*2); ctx.fill();
    if(s.tower){
      ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s.tower.icon, s.x, s.y);
    }
  });

  // Atualizar Inimigos
  for(let i=enemies.length-1; i>=0; i--){
    const e = enemies[i];
    const target = PATH[e.pathIdx+1];
    if(!target){
      lives--; enemies.splice(i,1);
      updateHUD();
      if(lives <= 0){ gameOver = true; document.getElementById('overlay').classList.add('show'); }
      continue;
    }
    const dx = target.x - e.x, dy = target.y - e.y, dist = Math.hypot(dx,dy);
    if(dist < 2){ e.pathIdx++; }
    else { e.x += (dx/dist)*e.speed; e.y += (dy/dist)*e.speed; }

    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
  }

  // Torres dispararem
  towers.forEach(t=>{
    t.cooldown--;
    let target = enemies.find(e=>Math.hypot(e.x-t.x, e.y-t.y) < t.range);
    if(target && t.cooldown <= 0){
      t.cooldown = t.rate;
      const dmgBonus = 1 + (persistent.talents.dmg||0)*0.15;
      target.hp -= t.dmg * dmgBonus;
      if(target.hp <= 0){
        const goldBonus = 1 + (persistent.talents.gold||0)*0.2;
        gold += target.gold * goldBonus;
        score += 10;
        persistent.essence += 1;
        save();
        enemies = enemies.filter(e=>e!==target);
        updateHUD();
      }
    }
  });

  if(running && enemies.length === 0 && document.getElementById('startBtn')){
    running = false;
  }

  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
init();
requestAnimationFrame(loop);
</script>
</body>
</html>

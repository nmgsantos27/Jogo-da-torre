<!DOCTYPE html>
<html lang="pt-PT">
<head>

<title>Defenda a Torre</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a1020; color:#e8ecf5;

  body { display:flex; justify-content:center; align-items:center; }
  #app { width:100%; max-width:500px; height:100vh; height:100dvh;

  #hud { display:flex; align-items:center; gap:5px; padding:8px 10px;

  .hstat.ess .val  { color:#c77dff; }
  .hstat.score .val{ color:#4ecdc4; }
  .hstat.life .val { color:#ff5252; }
  .hstat.wave .val { color:#64ffda; }
  .hstat.world .val{ color:#ff9800; }
  .hspacer { flex:1; }
  .hbtn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);

  #pauseBadge { position:absolute; top:12px; left:12px; z-index:5;

  #info.show { opacity:1; }
  #popup { position:absolute; bottom:12px; left:50%; transform:translate(-50%,20px);

<script>
"use strict";
const SAVE_KEY = "torreProgressV35";
const TILE = 36;
const MAX_RANKING = 20;

const WORLDS = [
  { id:1, name:"Prado Verde",    bg:"#0a1020", path:"#4a3b2c", pathDash:"#7a6046", accent:"#4ecdc4" },
  { id:2, name:"Deserto Árido",  bg:"#1a150a", path:"#5c4d32", pathDash:"#8c754d", accent:"#ff9800" },
  { id:3, name:"Vulcão Sombrio", bg:"#1a0a0a", path:"#422020", pathDash:"#733535", accent:"#ff5252" }
];

const TOWER_TYPES = {
  archer:    { name:"Arqueiro",  ico:"🏹", cost:60,  dmg:1,  range:130, rate:28, color:"#4ecdc4", special:null,       unlock:null },
  cannon:    { name:"Canhão",    ico:"💣", cost:240, dmg:9,  range:110, rate:70, color:"#ff9800", special:"splash",  splash:55,  unlock:null },
  ice:       { name:"Gelo",      ico:"❄️", cost:90,  dmg:1,  range:120, rate:40, color:"#81d4fa", special:"slow",    slow:0.5,   unlock:null },
  lightning: { name:"Relâmpago", ico:"⚡", cost:320, dmg:7,  range:140, rate:45, color:"#ffd700", special:"chain",   chain:3,    unlock:"lightning" },
  poison:    { name:"Veneno",    ico:"☠️", cost:280, dmg:5,  range:125, rate:35, color:"#9ccc65", special:"poison",  poisonDmg:3.5, unlock:"poison" }
};

const ENEMY_TYPES = {
  goblin: { name:"Goblin", hp:5,  gold:5,  color:"#7cb342", speed:0.85, radius:10 },
  orc:    { name:"Orc",    hp:14, gold:9,  color:"#8d6e63", speed:0.70, radius:12 },
  swift:  { name:"Veloz",  hp:8,  gold:7,  color:"#ffb74d", speed:1.30, radius:9  },
  tank:   { name:"Tanque", hp:35, gold:18, color:"#b0bec5", speed:0.50, radius:14 },
  boss:   { name:"Chefe",  hp:160,gold:50, color:"#e53935", speed:0.55, radius:18, lives:8 }
};

const TALENTS = [
  { id:"force",    ico:"⚔️", name:"Força",       desc:"+15% dano das torres por nível (Nv.3 desbloqueia ⚡)", max:5, cost:n=>4+n*2 },
  { id:"greed",    ico:"🪙", name:"Ganância",    desc:"+20% ouro obtido por nível (Nv.3 desbloqueia ☠️)", max:5, cost:n=>3+n*2 },
  { id:"vital",    ico:"❤️", name:"Vitalidade",  desc:"+1 vida inicial por nível",               max:5, cost:n=>3+n*2 },
  { id:"precision",ico:"🎯", name:"Precisão",    desc:"+8% alcance das torres por nível",        max:5, cost:n=>4+n*2 },
  { id:"speed",    ico:"⏱️", name:"Celeridade",  desc:"+10% cadência de tiro por nível",         max:5, cost:n=>5+n*2 },
  { id:"heritage", ico:"💰", name:"Herança",     desc:"+20 ouro inicial por nível",              max:3, cost:n=>6+n*2 },
  { id:"channel",  ico:"🔮", name:"Canalização", desc:"+1 essência extra por vaga",              max:5, cost:n=>5+n*3 }
];

function defaultPersistent() {
  return {
    essence:0, talents:{}, unlocked:{ lightning:false, poison:false },
    bestWave:0, bestScore:0, totalKills:0, totalGames:0,
    ranking:[], savedState:null, playerName:""
  };
}
let persistent = defaultPersistent();
let storageAvailable = true;

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (!p || typeof p !== "object") return;
    persistent = Object.assign(defaultPersistent(), p);
    persistent.essence = Math.max(0, Number(persistent.essence) || 0);
    persistent.talents = (persistent.talents && typeof persistent.talents === "object") ? persistent.talents : {};
    persistent.unlocked = Object.assign({ lightning:false, poison:false }, persistent.unlocked || {});
    if ((persistent.talents.force || 0) >= 3) persistent.unlocked.lightning = true;
    if ((persistent.talents.greed || 0) >= 3) persistent.unlocked.poison = true;
    persistent.ranking = Array.isArray(persistent.ranking) ? persistent.ranking.slice(0, MAX_RANKING) : [];
    persistent.playerName = typeof persistent.playerName === "string" ? persistent.playerName.slice(0,16) : "";
    if (persistent.savedState && typeof persistent.savedState !== "object") persistent.savedState = null;
  } catch(e) { console.warn("load falhou", e); persistent = defaultPersistent(); }
}

let saveDirty = false, lastSaveTime = 0;
function saveProgress(force) {
  const now = performance.now();
  if (!force && now - lastSaveTime < 1000) { saveDirty = true; return; }
  lastSaveTime = now; saveDirty = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(persistent)); }
  catch(e) {
    if (storageAvailable) {
      storageAvailable = false;
      try { showInfo("⚠️ Não é possível guardar (modo privado?)"); } catch(_){}
    }
    console.warn("save falhou", e);
  }
}

let gold = 0, lives = 12, maxLives = 12, wave = 1, world = 1, score = 0;
let running = false, gameOverFlag = false, paused = false;
let selectedType = null, selectedTower = null;
let towers = [], enemies = [], projectiles = [], particles = [], floats = [];
let spawnQueue = [], spawnTimer = 0, slots = [], PATH = [];
let killsThisRun = 0, towersBuiltThisRun = 0;
let speedMul = 1, hudDirty = true;
let hoverSlot = null;
let pendingSaleId = null;

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const goldLbl=$("goldLbl"), essLbl=$("essLbl"), scoreLbl=$("scoreLbl"), lifeLbl=$("lifeLbl"),
      waveLbl=$("waveLbl"), worldLbl=$("worldLbl"), speedBtn=$("speedBtn"), convBtn=$("convBtn"),
      menuBtn=$("menuBtn"), pauseBadge=$("pauseBadge"), infoEl=$("info"), popup=$("popup"),
      popTitle=$("popTitle"), popClose=$("popClose"), psDmg=$("psDmg"), psRng=$("psRng"),
      psRate=$("psRate"), upgBtn=$("upgBtn"), upgCost=$("upgCost"), evoBtn=$("evoBtn"),
      evoCost=$("evoCost"), sellBtn=$("sellBtn"), sellVal=$("sellVal"), towerScroll=$("towerScroll"),
      startBtn=$("startBtn"), startBtnTxt=$("startBtnTxt"), talentScreen=$("talentScreen"),
      rankingScreen=$("rankingScreen"), talEss=$("talEss"), talConv=$("talConv"), talList=$("talList"),
      talClose=$("talClose"), talSave=$("talSave"), btnRanking=$("btnRanking"), rankClose=$("rankClose"),
      globalRankingList=$("globalRankingList"), convGoldTxt=$("convGoldTxt"), overlay=$("overlay"),
      ovWave=$("ovWave"), ovWave2=$("ovWave2"), ovScore=$("ovScore"), ovKills=$("ovKills"),
      ovTowers=$("ovTowers"), ovName=$("ovName"), ovBtn=$("ovBtn"), ovRanking=$("ovRanking");

function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(_){} } }
function rand(a,b){ return a + Math.random()*(b-a); }
function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let infoTimer = 0;
function showInfo(msg){
  infoEl.textContent = msg; infoEl.classList.add("show");
  clearTimeout(infoTimer);
  infoTimer = setTimeout(()=>infoEl.classList.remove("show"), 1600);
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rand(1.2,3.4);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:rand(0.02,0.05),color,size:rand(2,4)});
  }
}
function floatText(x,y,txt,color){ floats.push({x,y,txt,color,life:1,vy:-0.8}); }
let COLS = 10, ROWS = 14, offX = 0, offY = 0;

function resizeCanvas(){
  const wrap = $("gamewrap");
  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || 400;
  if(!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + "px";
  cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rebuildStrategicSlots(w, h);
}

function rebuildStrategicSlots(w,h){
  const margin = 8;
  const oldCols=COLS, oldRows=ROWS, oldOffX=offX, oldOffY=offY;
  const previousTowers = towers.map(t => ({
    tower:t,
    nx: oldCols>0 ? (t.x-oldOffX)/(oldCols*TILE) : 0.5,
    ny: oldRows>0 ? (t.y-oldOffY)/(oldRows*TILE) : 0.5,
    col:t.col, row:t.row
  }));

  COLS = Math.max(7, Math.floor((w - margin*2)/TILE));
  ROWS = Math.max(10, Math.floor((h - margin*2)/TILE));
  offX = Math.floor((w - COLS*TILE)/2);
  offY = Math.floor((h - ROWS*TILE)/2);

  slots = []; towers = [];
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      slots.push({
        col:c, row:r,
        x: offX + c*TILE + TILE/2,
        y: offY + r*TILE + TILE/2,
        occupied:false, buildable:true
      });
    }
  }

  PATH = buildPath(offX, offY);

  slots.forEach(s => {
    for(let i=0;i<PATH.length-1;i++){
      if(distToSegment(s, PATH[i], PATH[i+1]) < TILE*0.85){ s.buildable = false; break; }
    }
  });

  previousTowers.forEach(item => {
    const t = item.tower;
    let slot = slots.find(s => s.buildable && !s.occupied && s.col === item.col && s.row === item.row);
    if (!slot) {
      const targetX = offX + Math.max(0, Math.min(1, item.nx)) * COLS * TILE;
      const targetY = offY + Math.max(0, Math.min(1, item.ny)) * ROWS * TILE;
      let best = Infinity;
      slots.forEach(s => {
        if (!s.buildable || s.occupied) return;
        const d = (s.x - targetX) ** 2 + (s.y - targetY) ** 2;
        if (d < best) { best = d; slot = s; }
      });
    }
    if (slot) {
      slot.occupied = true;
      t.slot = slot;
      t.col = slot.col; t.row = slot.row;
      t.x = slot.x; t.y = slot.y;
      towers.push(t);
    } else {
      const refund = TOWER_TYPES[t.type] ? TOWER_TYPES[t.type].cost : 0;
      gold += refund;
    }
  });
}

function distToSegment(p, v, w){
  const l2 = (w.x-v.x)**2 + (w.y-v.y)**2;
  if (l2 === 0) return Math.hypot(p.x-v.x, p.y-v.y);
  let t = ((p.x-v.x)*(w.x-v.x) + (p.y-v.y)*(w.y-v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (v.x + t*(w.x-v.x)), p.y - (v.y + t*(w.y-v.y)));
}

function buildPath(offX, offY){
  const c1 = Math.max(1, Math.floor(COLS * 0.15));
  const c2 = COLS - 1 - Math.max(1, Math.floor(COLS * 0.15));
  const r1 = Math.max(1, Math.floor(ROWS * 0.30));
  const r2 = Math.max(r1 + 2, Math.floor(ROWS * 0.65));
  const pts = [
    { col:c1, row:0 }, { col:c1, row:r1 }, { col:c2, row:r1 },
    { col:c2, row:r2 }, { col:c1, row:r2 }, { col:c1, row:ROWS-1 }
  ];
  return pts.map(p => ({
    x: offX + p.col*TILE + TILE/2,
    y: offY + p.row*TILE + TILE/2
  }));
}

function talentLvl(id){ return persistent.talents[id] || 0; }
function dmgMul()       { return 1 + talentLvl("force")*0.15; }
function goldMul()      { return 1 + talentLvl("greed")*0.20; }
function rangeMul()     { return 1 + talentLvl("precision")*0.08; }
function rateMul()      { return 1 - talentLvl("speed")*0.10; }
function startGoldBonus(){ return talentLvl("heritage")*20; }
function startLivesBonus(){ return talentLvl("vital")*1; }
function essencePerWave(){ return 1 + talentLvl("channel"); }

function towerStats(t){
  const base = TOWER_TYPES[t.type];
  const lvlMul = Math.pow(1.45, t.level-1);
  const starMul = Math.pow(1.25, t.stars);
  const dmg = base.dmg * lvlMul * starMul * dmgMul();
  const range = (base.range + (t.level-1)*18 + t.stars*12) * rangeMul();
  const rate = base.rate * Math.pow(0.82, t.level-1) * Math.pow(0.9, t.stars) * rateMul();
  return { dmg, range, rate: Math.max(8, rate) };
}
function towerUpgradeCost(t){ return Math.floor(TOWER_TYPES[t.type].cost * 0.85 * t.level); }
function towerEvolveCost(t) { return 4 + t.stars * 4; }
function towerSellValue(t)  { return Math.floor((TOWER_TYPES[t.type].cost + (t.level-1)*30) * 0.6); }

function buildTower(slot, type){
  const base = TOWER_TYPES[type];
  if (!base) return;
  if (base.unlock && !persistent.unlocked[base.unlock]) { showInfo("🔒 Bloqueada (Ver talentos)"); return; }
  if (gold < base.cost) { showInfo("🪙 Ouro insuficiente"); return; }
  if (slot.occupied || !slot.buildable) return;
  gold -= base.cost;
  const t = { type, level:1, stars:0, col:slot.col, row:slot.row,
    x:slot.x, y:slot.y, slot, cooldown:0, angle:0 };
  slot.occupied = true;
  towers.push(t);
  towersBuiltThisRun++;
  hudDirty = true;
  vibrate(15);
  burst(t.x, t.y, base.color, 8);
  saveProgress(false);
}

function upgradeTower(t){
  if (t.level >= 3) { showInfo("⭐ Nível máximo"); return; }
  const cost = towerUpgradeCost(t);
  if (gold < cost) { showInfo("🪙 Ouro insuficiente"); return; }
  gold -= cost; t.level++;
  hudDirty = true; vibrate(12);
  burst(t.x, t.y, "#4ecdc4", 10);
  refreshPopup(); saveProgress(false);
}

function evolveTower(t){
  if (t.level < 3) { showInfo("⬆️ Precisas de nível 3"); return; }
  if (t.stars >= 5) { showInfo("🌟 Estrela máxima!"); return; }
  const cost = towerEvolveCost(t);
  if (persistent.essence < cost) { showInfo("💎 Essência insuficiente"); return; }
  persistent.essence -= cost; t.stars++;
  hudDirty = true; vibrate(20);
  burst(t.x, t.y, "#c77dff", 16);
  refreshPopup(); saveProgress(false);
}

function sellTower(t){
  const val = towerSellValue(t);
  gold += val;
  t.slot.occupied = false;
  towers = towers.filter(x => x !== t);
  selectedTower = null; hidePopup(); hudDirty = true;
  burst(t.x, t.y, "#ffd700", 10);
  floatText(t.x, t.y-16, "+" + val, "#ffd700");
  saveProgress(false);
}

function showPopup(t){ selectedTower = t; popup.classList.add("show"); refreshPopup(); }
function hidePopup(){
  popup.classList.remove("show"); selectedTower = null;
  pendingSaleId = null;
  sellBtn.classList.remove("confirm");
  sellBtn.innerHTML = 'Vender<small id="sellVal">0</small>';
}
function refreshPopup(){
  const t = selectedTower;
  if (!t) return;
  const base = TOWER_TYPES[t.type];
  const st = towerStats(t);
  popTitle.textContent = base.ico + " " + base.name + " " + "⭐".repeat(t.stars) + " · Nv." + t.level;
  psDmg.textContent = st.dmg.toFixed(1);
  psRng.textContent = Math.round(st.range);
  psRate.textContent = Math.round(st.rate) + "f";
  const upCost = towerUpgradeCost(t), evCost = towerEvolveCost(t), sv = towerSellValue(t);
  if (t.level >= 3) { upgBtn.disabled = true; upgCost.textContent = "MAX"; }
  else { upgBtn.disabled = gold < upCost; upgCost.textContent = "🪙 " + upCost; }
  if (t.stars >= 5) { evoBtn.disabled = true; evoCost.textContent = "MAX"; }
  else { evoBtn.disabled = t.level < 3 || persistent.essence < evCost; evoCost.textContent = "💎 " + evCost; }
  sellBtn.disabled = false;
  sellBtn.classList.remove("confirm");
  sellBtn.innerHTML = 'Vender<small id="sellVal">🪙 ' + sv + '</small>';
  pendingSaleId = null;
}
function spawnEnemy(type, waveNum, worldNum){
  const base = ENEMY_TYPES[type];
  if (!base) return;
  const worldFactor = 1 + (worldNum - 1) * 0.6;
  let tierBonus = 1 + Math.floor(waveNum / 8) * 0.45;
  if (waveNum % 5 === 0) tierBonus += 0.25;
  const hpScale = (1 + (waveNum - 1) * 0.42 * tierBonus) * worldFactor;
  const hp = Math.ceil(base.hp * hpScale);
  const speed = base.speed * (1 + (worldNum - 1) * 0.10) * (1 + Math.floor(waveNum / 8) * 0.05);
  enemies.push({
    type, hp, maxHp: hp, gold: Math.ceil(base.gold * (1 + (worldNum-1)*0.2)),
    speed, radius: base.radius, color: base.color, x: PATH[0].x, y: PATH[0].y,
    waypoint: 1, slow: 0, poison: 0, poisonDmg: 0, alive: true
  });
}

function startWave(){
  if (running) return;
  running = true; paused = false;
  spawnQueue = []; spawnTimer = 0;
  const isBoss = wave % 5 === 0;
  const waveTierMult = 1 + Math.floor(wave / 10) * 0.15;
  const count = isBoss
    ? (10 + Math.floor(wave * 0.7 * waveTierMult))
    : (8 + Math.floor(wave * 1.0 * waveTierMult));
  for (let i = 0; i < count; i++) {
    let type = "goblin";
    if (wave >= 3 && Math.random() < 0.35) type = "orc";
    if (wave >= 5 && Math.random() < 0.25) type = "swift";
    if (wave >= 7 && Math.random() < 0.25) type = "tank";
    const delayStep = Math.max(12, 34 - Math.floor(wave / 4) * 2);
    spawnQueue.push({ type, delay: i === 0 ? 0 : delayStep });
  }
  if (isBoss) spawnQueue.push({ type: "boss", delay: 30 });
  startBtn.disabled = true;
  updateStartBtn();
}

function hitEnemy(e, dmg){
  if (!e.alive) return;
  e.hp -= dmg;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  if (!e.alive) return;
  e.alive = false;
  enemies = enemies.filter(x => x !== e);
  const g = Math.round(e.gold * goldMul());
  gold += g; score += g; killsThisRun++;
  hudDirty = true;
  burst(e.x, e.y, e.color, 6);
  floatText(e.x, e.y-14, "+" + g, "#ffd700");
  if (e.type === "boss") { persistent.essence += 2 + world; saveProgress(false); }
}
function damageBase(e){
  if (!e.alive) return;
  const livesCfg = e.type === "boss" ? 8 : (ENEMY_TYPES[e.type] && ENEMY_TYPES[e.type].lives ? ENEMY_TYPES[e.type].lives : 1);
  lives -= livesCfg; vibrate(40);
  e.alive = false;
  enemies = enemies.filter(x => x !== e);
  hudDirty = true;
  burst(e.x, e.y, "#ff5252", 12);
  if (lives <= 0) endGame();
}

function fireProjectile(t, target){
  const base = TOWER_TYPES[t.type];
  const st = towerStats(t);
  t.angle = Math.atan2(target.y - t.y, target.x - t.x);
  projectiles.push({ x:t.x, y:t.y, target, speed:8, dmg:st.dmg,
    color:base.color, type:t.type, special:base.special,
    splash:base.splash || 0, slow:base.slow || 0,
    chain:base.chain || 0, poisonDmg:base.poisonDmg || 0, hit:false });
}
function hitProjectile(p){
  if (p.hit) return;
  p.hit = true;
  const tgt = p.target;
  if (!tgt || !tgt.alive) return;
  if (p.special === "splash") {
    enemies.forEach(e => {
      if (!e.alive) return;
      if (dist(e, tgt) <= p.splash) { hitEnemy(e, p.dmg); if (e.alive) burst(e.x, e.y, p.color, 4); }
    });
  } else if (p.special === "chain") {
    hitEnemy(tgt, p.dmg);
    let last = tgt, chained = [tgt];
    for (let i=0;i<p.chain-1;i++){
      let next = null, bestD = 90;
      enemies.forEach(e => {
        if (!e.alive || chained.includes(e)) return;
        const d = dist(e, last); if (d < bestD) { bestD = d; next = e; }
      });
      if (!next) break;
      hitEnemy(next, p.dmg * 0.7);
      chained.push(next); last = next;
    }
  } else if (p.special === "slow") {
    hitEnemy(tgt, p.dmg);
    if (tgt.alive) tgt.slow = Math.max(tgt.slow, p.slow);
  } else if (p.special === "poison") {
    hitEnemy(tgt, p.dmg);
    if (tgt.alive) { tgt.poison = 90; tgt.poisonDmg = p.poisonDmg; }
  } else { hitEnemy(tgt, p.dmg); }
  burst(p.x, p.y, p.color, 5);
}

function update(){
  if (paused || !running) return;
  if (spawnQueue.length > 0) {
    spawnTimer++;
    if (spawnTimer >= spawnQueue[0].delay) {
      spawnTimer = 0;
      const s = spawnQueue.shift();
      spawnEnemy(s.type, wave, world);
    }
  } else if (enemies.length === 0 && running) {
    running = false;
    const bonus = 12 + wave * 2 * world;
    gold += bonus; score += bonus;
    persistent.essence += essencePerWave();
    if (wave % 5 === 0) {
      persistent.essence += 3;
      world++;
      const wname = (WORLDS[(world-1)%WORLDS.length]?.name) || "Extra";
      showInfo("🌍 Mundo " + world + ": " + wname + "!");
    } else {
      showInfo("✅ Vaga concluída! +" + bonus + " 🪙");
    }
    wave++;
    hudDirty = true;
    vibrate(25);
    startBtn.disabled = false;
    updateStartBtn();
    saveProgress(true);
    return;
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.alive) continue;
    if (e.poison > 0) {
      e.poison--; e.hp -= e.poisonDmg;
      if (e.hp <= 0) { killEnemy(e); continue; }
    }
    let sp = e.speed;
    if (e.slow > 0) { e.slow--; sp *= 0.5; }
    if (e.waypoint < PATH.length) {
      const wp = PATH[e.waypoint];
      const dx = wp.x - e.x, dy = wp.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d < 4) e.waypoint++;
      else { e.x += (dx/d)*sp; e.y += (dy/d)*sp; }
    } else {
      damageBase(e);
      if (gameOverFlag) return;
    }
  }

  if (gameOverFlag || !running) return;

  towers.forEach(t => {
    t.cooldown--;
    if (t.cooldown > 0) return;
    const st = towerStats(t);
    let target = null, bestD = st.range;
    enemies.forEach(e => {
      if (!e.alive) return;
      const d = dist(e, t);
      if (d < bestD) { bestD = d; target = e; }
    });
    if (target) { fireProjectile(t, target); t.cooldown = st.rate; }
  });

  projectiles = projectiles.filter(p => {
    if (p.hit) return false;
    const tgt = p.target;
    if (!tgt || !tgt.alive) return false;
    const dx = tgt.x - p.x, dy = tgt.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < p.speed) { hitProjectile(p); return false; }
    p.x += (dx/d)*p.speed; p.y += (dy/d)*p.speed;
    return true;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94;
    p.life -= p.decay; return p.life > 0;
  });
  floats = floats.filter(f => {
    f.y += f.vy; f.life -= 0.02; return f.life > 0;
  });
}

function render(){
  const w = cv.width / (window.devicePixelRatio || 1);
  const h = cv.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);
  const theme = WORLDS[(world - 1) % WORLDS.length];
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = theme.path;
  ctx.lineWidth = TILE * 0.9;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  PATH.forEach((p, i) => { i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.stroke();

  ctx.strokeStyle = theme.pathDash;
  ctx.lineWidth = 4;
  ctx.setLineDash([12, 16]);
  ctx.beginPath();
  PATH.forEach((p, i) => { i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.stroke();
  ctx.setLineDash([]);

  slots.forEach(s => {
    if (!s.buildable) return;
    if (s.occupied) {
      ctx.strokeStyle = "rgba(255,215,0,0.15)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.strokeRect(s.x-TILE*0.4, s.y-TILE*0.4, TILE*0.8, TILE*0.8);
      ctx.setLineDash([]);
      return;
    }
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.strokeRect(s.x-TILE*0.4, s.y-TILE*0.4, TILE*0.8, TILE*0.8);
    ctx.setLineDash([]);
  });

  if (selectedType && hoverSlot) {
    const base = TOWER_TYPES[selectedType];
    if (base) {
      const r = base.range * rangeMul();
      ctx.beginPath();
      ctx.arc(hoverSlot.x, hoverSlot.y, r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(78,205,196,0.10)";
      ctx.fill();
      ctx.strokeStyle = "rgba(78,205,196,0.45)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = "rgba(78,205,196,0.35)";
      ctx.fillRect(hoverSlot.x-TILE*0.4, hoverSlot.y-TILE*0.4, TILE*0.8, TILE*0.8);
    }
  }

  const last = PATH[PATH.length-1];
  ctx.font = "28px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🏰", last.x, last.y - TILE*0.6);

  towers.forEach(t => {
    const base = TOWER_TYPES[t.type];
    if (t === selectedTower) {
      const st = towerStats(t);
      ctx.beginPath();
      ctx.arc(t.x, t.y, st.range, 0, Math.PI*2);
      ctx.fillStyle = "rgba(78,205,196,0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(78,205,196,0.5)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(t.x, t.y, TILE*0.35, 0, Math.PI*2);
    ctx.fillStyle = base.color;
    ctx.fill();
    ctx.strokeStyle = "#0a1020";
    ctx.lineWidth = 3;
    ctx.stroke();
    if (t.stars > 0) {
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 9px sans-serif";
      ctx.fillText("★".repeat(t.stars), t.x, t.y - TILE*0.55);
    }
    ctx.font = "20px sans-serif";
    ctx.fillText(base.ico, t.x, t.y + 1);
  });

  enemies.forEach(e => {
    if (!e.alive) return;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
    ctx.fillStyle = e.color; ctx.fill();
    ctx.strokeStyle = "#0a1020"; ctx.lineWidth = 2; ctx.stroke();
    if (e.hp < e.maxHp) {
      const bw = e.radius*2;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(e.x - bw/2, e.y - e.radius - 8, bw, 4);
      ctx.fillStyle = e.type === "boss" ? "#ff5252" : "#4ecdc4";
      ctx.fillRect(e.x - bw/2, e.y - e.radius - 8, bw * (e.hp/e.maxHp), 4);
    }
    if (e.slow > 0) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius+3, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(129,212,250,0.7)"; ctx.lineWidth = 2; ctx.stroke();
    }
    if (e.poison > 0) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius+4, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(156,204,101,0.7)"; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });

  projectiles.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
  });

  particles.forEach(p => {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  floats.forEach(f => {
    ctx.globalAlpha = f.life; ctx.fillStyle = f.color;
    ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(f.txt, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}
function updateHUD(){
  goldLbl.textContent = Math.floor(gold || 0);
  essLbl.textContent = persistent.essence;
  scoreLbl.textContent = Math.floor(score || 0);
  lifeLbl.textContent = Math.max(0, lives || 0);
  waveLbl.textContent = wave || 1;
  worldLbl.textContent = world || 1;
  speedBtn.textContent = speedMul + "x";
  convGoldTxt.textContent = Math.floor(gold || 0);
  hudDirty = false;
}

function updateStartBtn(){
  if (running) {
    startBtnTxt.textContent = "⏳ A jogar";
    startBtn.classList.remove("boss");
    startBtn.disabled = true;
    return;
  }
  const isBoss = wave % 5 === 0;
  if (isBoss) { startBtnTxt.textContent = "CHEFE " + wave + " 👑"; startBtn.classList.add("boss"); }
  else { startBtnTxt.textContent = "VAGA " + wave; startBtn.classList.remove("boss"); }
  startBtn.disabled = false;
}

function buildTowerButtons(){
  towerScroll.innerHTML = "";
  Object.keys(TOWER_TYPES).forEach(type => {
    const base = TOWER_TYPES[type];
    const btn = document.createElement("button");
    btn.className = "tbtn";
    btn.dataset.type = type;
    const locked = base.unlock && !persistent.unlocked[base.unlock];
    if (locked) {
      btn.classList.add("locked");
      btn.innerHTML = '<div class="ico">' + base.ico + '</div>' +
        '<div class="nm" style="color:#ff5252">Bloqueada</div>' +
        '<div class="cost" style="color:#8fa3bd;font-size:9px;">Talentos</div>';
    } else {
      btn.innerHTML = '<div class="ico">' + base.ico + '</div>' +
        '<div class="nm">' + base.name + '</div>' +
        '<div class="cost">🪙 ' + base.cost + '</div>';
    }
    btn.addEventListener("click", () => {
      if (locked) { showInfo("🔒 " + base.name + " desbloqueia nos Talentos (Nv.3)"); return; }
      if (selectedType === type) {
        selectedType = null; btn.classList.remove("sel"); hoverSlot = null;
      } else {
        selectedType = type;
        document.querySelectorAll(".tbtn").forEach(b => b.classList.remove("sel"));
        btn.classList.add("sel");
        hidePopup();
      }
    });
    towerScroll.appendChild(btn);
  });
}

function canvasCoords(evt){
  const r = cv.getBoundingClientRect();
  const pt = evt.touches ? evt.touches[0] : evt;
  return { x: pt.clientX - r.left, y: pt.clientY - r.top };
}

cv.addEventListener("pointerdown", evt => {
  evt.preventDefault();
  if (paused || gameOverFlag) return;
  const p = canvasCoords(evt);
  if (selectedType) {
    const slot = slots.find(s => dist(p, s) < TILE/2);
    if (slot && !slot.occupied && slot.buildable) {
      buildTower(slot, selectedType);
      hoverSlot = null;
      return;
    }
    hidePopup();
    return;
  }
  for (let i = 0; i < towers.length; i++) {
    if (dist(p, towers[i]) < TILE*0.45) { showPopup(towers[i]); return; }
  }
  hidePopup();
});

cv.addEventListener("pointermove", evt => {
  if (paused || gameOverFlag) return;
  const p = canvasCoords(evt);
  if (selectedType) {
    hoverSlot = slots.find(s => dist(p, s) < TILE/2 && !s.occupied && s.buildable) || null;
  } else {
    hoverSlot = null;
  }
});

cv.addEventListener("pointerleave", () => { hoverSlot = null; });

popClose.addEventListener("click", hidePopup);
upgBtn.addEventListener("click", () => { if (selectedTower) upgradeTower(selectedTower); });
evoBtn.addEventListener("click", () => { if (selectedTower) evolveTower(selectedTower); });
sellBtn.addEventListener("click", () => {
  if (!selectedTower) return;
  const t = selectedTower;
  if (pendingSaleId === t) {
    pendingSaleId = null;
    sellTower(t);
    return;
  }
  pendingSaleId = t;
  sellBtn.classList.add("confirm");
  sellBtn.innerHTML = 'Confirmar<small>Toca de novo</small>';
  setTimeout(() => {
    if (pendingSaleId === t) {
      pendingSaleId = null;
      if (selectedTower === t) {
        sellBtn.classList.remove("confirm");
        const sv = towerSellValue(t);
        sellBtn.innerHTML = 'Vender<small>🪙 ' + sv + '</small>';
      }
    }
  }, 3000);
});

speedBtn.addEventListener("click", () => {
  speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 3 : 1;
  vibrate(8);
  showInfo("⏩ Velocidade " + speedMul + "x");
  updateHUD();
});

function convertGold(){
  if (gold < 250) { showInfo("🪙 Precisas de 250 ouro"); return; }
  gold -= 250; persistent.essence++;
  hudDirty = true; vibrate(10);
  showInfo("💎 +1 essência");
  if (talentScreen.classList.contains("show")) renderTalentList();
  saveProgress(true);
}
convBtn.addEventListener("click", convertGold);
talConv.addEventListener("click", convertGold);
startBtn.addEventListener("click", startWave);

function openTalents(){
  paused = true;
  pauseBadge.classList.add("show");
  talentScreen.classList.add("show");
  renderTalentList();
  forceSave();
}
function closeTalents(){
  paused = false;
  pauseBadge.classList.remove("show");
  talentScreen.classList.remove("show");
  saveProgress(true);
}

function renderTalentList(){
  talEss.textContent = persistent.essence;
  talList.innerHTML = "";
  TALENTS.forEach(tal => {
    const lvl = talentLvl(tal.id);
    const cost = tal.cost(lvl);
    const maxed = lvl >= tal.max;
    const canBuy = !maxed && persistent.essence >= cost;
    const div = document.createElement("div");
    div.className = "tal-item";
    div.innerHTML = '<div class="tico">' + tal.ico + '</div>' +
      '<div class="tinfo">' +
        '<div class="tnm">' + tal.name + ' <span style="color:#c77dff;font-weight:700;font-size:12px;">(' + lvl + '/' + tal.max + ')</span></div>' +
        '<div class="tdesc">' + tal.desc + '</div>' +
      '</div>' +
      '<button class="tal-buy" ' + (canBuy ? "" : "disabled") + '>' +
        (maxed ? "MAX" : "💎 " + cost) +
      '</button>';
    const btn = div.querySelector(".tal-buy");
    btn.addEventListener("click", () => {
      if (persistent.essence < cost) { showInfo("💎 Essência insuficiente"); return; }
      persistent.essence -= cost;
      persistent.talents[tal.id] = lvl + 1;
      if (tal.id === "force" && persistent.talents[tal.id] >= 3) persistent.unlocked.lightning = true;
      if (tal.id === "greed" && persistent.talents[tal.id] >= 3) persistent.unlocked.poison = true;
      vibrate(15);
      showInfo("✨ " + tal.name + " nível " + (lvl+1));
      saveProgress(true);
      renderTalentList();
      buildTowerButtons();
      updateHUD();
    });
    talList.appendChild(div);
  });
}

menuBtn.addEventListener("click", openTalents);
talClose.addEventListener("click", closeTalents);

function resumeGame(){
  if (talentScreen.classList.contains("show") || rankingScreen.classList.contains("show") || gameOverFlag) return;
  paused = false;
  pauseBadge.classList.remove("show");
  lastTime = 0;
}
pauseBadge.addEventListener("click", resumeGame);
pauseBadge.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") { event.preventDefault(); resumeGame(); }
});

talSave.addEventListener("click", () => { forceSave(); showInfo("💾 Jogo guardado!"); vibrate(20); });

function renderGlobalRanking(){
  globalRankingList.innerHTML = "";
  const sorted = persistent.ranking.slice().sort((a,b) => b.score - a.score).slice(0, 10);
  if (sorted.length === 0) {
    globalRankingList.innerHTML = '<div style="text-align:center;color:#5a6b82;font-size:13px;padding:20px;">Ainda sem recordes</div>';
    return;
  }
  sorted.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "rk-item";
    d.innerHTML = '<div class="rk-pos">#' + (i+1) + '</div>' +
      '<div class="rk-name">' + escapeHtml(r.name || "Anónimo") + '</div>' +
      '<div class="rk-score">' + r.score + ' pts (vaga ' + r.wave + ')</div>';
    globalRankingList.appendChild(d);
  });
}

btnRanking.addEventListener("click", () => {
  talentScreen.classList.remove("show");
  renderGlobalRanking();
  rankingScreen.classList.add("show");
});
rankClose.addEventListener("click", () => {
  rankingScreen.classList.remove("show");
  talentScreen.classList.add("show");
});

function renderGameOverRanking(){
  ovRanking.innerHTML = "";
  const sorted = persistent.ranking.slice().sort((a,b) => b.score - a.score).slice(0, 10);
  if (sorted.length === 0) {
    ovRanking.innerHTML = '<div style="text-align:center;color:#5a6b82;font-size:13px;padding:20px;">Ainda sem recordes</div>';
    return;
  }
  sorted.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "rk-item";
    d.innerHTML = '<div class="rk-pos">#' + (i+1) + '</div>' +
      '<div class="rk-name">' + escapeHtml(r.name || "Anónimo") + '</div>' +
      '<div class="rk-score">' + r.score + '</div>';
    ovRanking.appendChild(d);
  });
}

function showGameOver(){
  overlay.classList.add("show");
  ovWave.textContent = Math.max(0, wave - 1);
  ovWave2.textContent = Math.max(0, wave - 1);
  ovScore.textContent = Math.floor(score);
  ovKills.textContent = killsThisRun;
  ovTowers.textContent = towersBuiltThisRun;
  ovName.value = persistent.playerName || "";
  renderGameOverRanking();
}

function endGame(){
  if (gameOverFlag) return;
  gameOverFlag = true; running = false;
  persistent.totalGames++;
  persistent.totalKills += killsThisRun;
  if (wave - 1 > persistent.bestWave) persistent.bestWave = wave - 1;
  if (score > persistent.bestScore) persistent.bestScore = Math.floor(score);
  const bonusEss = Math.floor((gold || 0) * 0.005);
  persistent.essence += bonusEss;
  persistent.savedState = null;
  saveProgress(true);
  showGameOver();
}

ovBtn.addEventListener("click", () => {
  const name = (ovName.value || "").trim().replace(/[<>]/g, "").slice(0, 16) || "Anónimo";
  persistent.playerName = name;
  persistent.ranking.push({ name, score: Math.floor(score), wave: wave - 1, date: Date.now() });
  persistent.ranking.sort((a,b) => b.score - a.score);
  persistent.ranking = persistent.ranking.slice(0, MAX_RANKING);
  saveProgress(true);
  startNewGame();
});

function startNewGame(){
  overlay.classList.remove("show");
  gameOverFlag = false; paused = false;
  pauseBadge.classList.remove("show");
  persistent.savedState = null;
  gold = 100 + startGoldBonus();
  maxLives = 12 + startLivesBonus();
  lives = maxLives;
  wave = 1; world = 1; score = 0; running = false;
  selectedType = null; selectedTower = null; hoverSlot = null;
  enemies = []; projectiles = []; particles = []; floats = [];
  spawnQueue = []; spawnTimer = 0;
  killsThisRun = 0; towersBuiltThisRun = 0; speedMul = 1;
  slots.forEach(s => { s.occupied = false; });
  towers = [];
  hudDirty = true;
  updateHUD();
  updateStartBtn();
  buildTowerButtons();
  hidePopup();
  saveProgress(true);
}

let lastTime = 0, acc = 0;
const FRAME = 1000 / 60;
function loop(now){
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = now;
  const dt = now - lastTime;
  lastTime = now;
  if (!paused) {
    acc += dt * speedMul;
    let steps = 0;
    while (acc >= FRAME && steps < 6) { update(); acc -= FRAME; steps++; }
    if (acc > FRAME * 6) acc = 0;
  }
  if (hudDirty) updateHUD();
  render();
}

let resizeTimer = 0;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resizeCanvas(); buildTowerButtons(); }, 120);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

function forceSave(){
  if (gameOverFlag) return;
  persistent.savedState = {
    wave, world, gold, lives, score,
    towers: towers.map(t => ({ type:t.type, level:t.level, stars:t.stars, col:t.col, row:t.row }))
  };
  saveProgress(true);
}

setInterval(() => {
  if (running && !paused) forceSave();
  else if (saveDirty) saveProgress(true);
}, 5000);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    forceSave();
    if (running && !paused) { paused = true; pauseBadge.classList.add("show"); }
  } else if (document.visibilityState === "visible") {
    if (!talentScreen.classList.contains("show") &&
        !rankingScreen.classList.contains("show") && !gameOverFlag) {
      paused = false;
      pauseBadge.classList.remove("show");
      lastTime = 0;
    }
  }
});
window.addEventListener("pagehide", forceSave);

function initGame(){
  loadProgress();
  if (persistent.savedState) {
    const s = persistent.savedState;
    wave = s.wave || 1;
    world = s.world || 1;
    gold = s.gold || 100;
    lives = Math.max(1, s.lives || 12);
    score = s.score || 0;
    maxLives = Math.max(lives, 12 + startLivesBonus());
    running = false; gameOverFlag = false; paused = false;
    enemies = []; projectiles = []; particles = []; floats = [];
    spawnQueue = []; spawnTimer = 0;
    killsThisRun = 0; towersBuiltThisRun = 0; speedMul = 1;
    selectedType = null; selectedTower = null; hoverSlot = null;
    setTimeout(() => {
      resizeCanvas();
      if (Array.isArray(s.towers)) {
        s.towers.flat().forEach(st => {
          const slot = slots.find(x => x.col === st.col && x.row === st.row && x.buildable);
          if (slot && !slot.occupied) {
            slot.occupied = true;
            towers.push({
              type: st.type, level: st.level || 1, stars: st.stars || 0,
              col: st.col, row: st.row, x: slot.x, y: slot.y,
              slot, cooldown: 0, angle: 0
            });
          }
        });
      }
    }, 50);
  } else {
    gold = 100 + startGoldBonus();
    maxLives = 12 + startLivesBonus();
    lives = maxLives;
    wave = 1; world = 1; score = 0; running = false;
    gameOverFlag = false; paused = false;
    enemies = []; projectiles = []; particles = []; floats = [];
    spawnQueue = []; spawnTimer = 0;
    killsThisRun = 0; towersBuiltThisRun = 0; speedMul = 1;
    selectedType = null; selectedTower = null; hoverSlot = null;
    towers = [];
  }

  resizeCanvas();
  setTimeout(resizeCanvas, 50);
  setTimeout(resizeCanvas, 200);

  buildTowerButtons();
  updateHUD();
  updateStartBtn();
  renderTalentList();
  ovName.value = persistent.playerName || "";
  requestAnimationFrame(loop);
}

initGame();
</script>
